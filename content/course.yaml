  - id: collections
    slug: collections
    order: 3
    title: Строки и коллекции
    status: planned
    summary: Индексы, срезы, list, tuple, set, dict и comprehensions.
  - id: functions
    slug: functions
    order: 4
    title: Функции
    status: planned
    summary: def, параметры, return, область видимости, args и рекурсия.
