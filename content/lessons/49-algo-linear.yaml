id: python.algorithms.algo-linear
slug: algo-linear
section: algorithms
title: Линейный поиск
order: 6
weight: 1
prerequisites:
- python.algorithms.algo-queue
goal: Найти индекс цены в списке или вернуть -1.
tags:
- поиск
- индекс
theory:
- Линейный поиск сравнивает искомое значение с элементами списка по порядку, с начала. Список
  не обязан быть отсортирован. Как только значение совпало, функция возвращает его индекс.
- 'Если список кончился без совпадения, возвращают -1. Ноль для отказа не годится: нулевой
  индекс принадлежит первому элементу. Вызывающий код отличает находку от промаха по этому
  ответу.'
- В худшем случае сравнений столько, сколько элементов. На коротком журнале это приемлемо.
  Функция возвращает число, а печать остаётся снаружи.
examples:
- title: Индекс сосны
  code: "def find(items, target):\n    for i in range(len(items)):\n        if items[i] ==\
    \ target:\n            return i\n    return -1\nprint(find(['ель', 'сосна', 'пихта'],\
    \ 'сосна'))\n"
  explanation: Сосна стоит на индексе 1, его и возвращают.
- title: Цены нет
  code: "def find(items, target):\n    for i in range(len(items)):\n        if items[i] ==\
    \ target:\n            return i\n    return -1\nprint(find([10, 20, 30], 5))\n"
  explanation: Пятёрки в списке нет, функция возвращает -1.
outcomes:
- просматривать список с начала
- возвращать индекс первого совпадения
- возвращать -1, если значения нет
- не использовать ноль как признак промаха
