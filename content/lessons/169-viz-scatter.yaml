id: python.viz.viz-scatter
slug: viz-scatter
section: viz
title: Точки
order: 7
weight: 1
prerequisites:
- python.viz.viz-box
goal: Считать точки, которые лежат выше прямой y = x.
tags:
- точки
theory:
- Точечный график ставит точку на каждую пару чисел. В matplotlib это plt.scatter(xs, ys).
  Одна ось — не причина второй, пока этого не сказали отдельно.
- Прямая y = x делит облако на две части. Точка выше неё имеет y больше x. Точка на прямой
  в этот счёт не входит.
- Упражнение печатает число таких точек, потому что matplotlib нет в среде браузера.
examples:
- title: Выше прямой
  code: 'points = [(1, 4), (5, 2), (3, 3), (2, 8)]

    above = sum(1 for x, y in points if y > x)

    print(above)

    '
  explanation: Выше прямой лежат (1, 4) и (2, 8). Точка (3, 3) на прямой.
- title: Сколько пар
  code: 'points = [(0, 1), (4, 1)]

    print(len(points))

    '
  explanation: На графике было бы две точки, независимо от того, какая выше.
outcomes:
- ставить точку по паре чисел
- выбирать scatter для связи двух величин
- считать точки выше прямой y = x
- не называть ось причиной без отдельного довода
