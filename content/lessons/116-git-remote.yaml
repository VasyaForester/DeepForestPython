id: python.github.git-remote
slug: git-remote
section: github
title: remote, pull и push
order: 6
weight: 1
prerequisites:
- python.github.git-rebase
goal: Переносить недостающие коммиты между локальным и удалённым списками.
tags:
- remote
- pull
- push
theory:
- Удалённый репозиторий подключают командой git remote add origin и адресом. git pull забирает
  коммиты, которых нет локально. git push отправляет локальные коммиты, которых нет на удалённой
  стороне.
- Песочница не ходит в сеть и не вызывает git. Локальная и удалённая истории — два списка
  сообщений. pull дописывает в локальный список то, что есть только в удалённом.
- 'push делает обратное: дополняет удалённый список из локального. Уже лежащее сообщение не
  копируют.'
examples:
- title: Забрать с remote
  code: "local = ['старт склада']\nremote = ['старт склада', 'цены поставки']\nfor message\
    \ in remote:\n    if message not in local:\n        local.append(message)\nprint(local[-1])\n"
  explanation: 'После pull локальная вершина совпала с удалённой: цены поставки.'
- title: Отправить на remote
  code: "local = ['старт склада', 'скидка']\nremote = ['старт склада']\nfor message in local:\n\
    \    if message not in remote:\n        remote.append(message)\nprint(remote[-1])\n"
  explanation: push дописал скидку на удалённую сторону.
outcomes:
- моделировать git pull как дописывание локального списка
- моделировать git push в обратную сторону
- не дублировать уже известные сообщения
- считать, сколько коммитов принесёт pull
resources:
- kind: docs
  title: Python Tutorial
  url: https://docs.python.org/3/tutorial/index.html
- kind: youtube
  title: CS50P — Lecture 9
  url: https://www.youtube.com/watch?v=5qz5pSO1YTQ
  author: Harvard CS50
tasks:
- type: choice
  title: Куда тянет pull
  difficulty: 1
  context: neutral
  prompt: Что делает команда git pull с локальной историей?
  options:
  - id: a
    text: Дописывает коммиты, которые есть на remote и которых ещё нет локально
  - id: b
    text: Удаляет локальные коммиты
  - id: c
    text: Создаёт pull request
  answer: a
  hints:
  - pull забирает недостающее с удалённой стороны.
  - Свои уникальные коммиты он сам по себе не стирает в этой модели.
  - Pull request — отдельный запрос на проверку, не команда pull.
  solution: a
  explanation: pull обновляет локальный список из remote.
  id: python.github.git-remote.t1
- type: predict_output
  title: После pull
  difficulty: 1
  context: neutral
  prompt: Что напечатается?
  options:
  - id: a
    text: цены поставки
  - id: b
    text: старт склада
  - id: c
    text: remote
  answer: a
  hints:
  - В удалённом списке есть новое сообщение.
  - Его дописывают в local.
  - Имя remote не печатается.
  solution: a
  explanation: Локальная вершина становится ценами поставки.
  code: "local = ['старт склада']\nremote = ['старт склада', 'цены поставки']\nfor message\
    \ in remote:\n    if message not in local:\n        local.append(message)\nprint(local[-1])\n"
  id: python.github.git-remote.t2
- type: code
  title: pull
  difficulty: 2
  context: development
  prompt: 'Прочитайте локальный список и удалённый. Выведите локальный после pull: добавьте
    то, чего в нём не было.'
  starter_code: ''
  tests:
  - stdin: '1

      старт склада

      2

      старт склада

      цены поставки

      '
    expected_stdout: 'старт склада

      цены поставки

      '
  - stdin: '2

      старт склада

      скидка

      1

      старт склада

      '
    expected_stdout: 'старт склада

      скидка

      '
  hints:
  - Сначала локальный список, потом удалённый.
  - Не дублируйте знакомые сообщения.
  - Печатайте уже обновлённый локальный список.
  solution: "def read_commits():\n    count = int(input())\n    return [input().strip() for\
    \ _ in range(count)]\nlocal = read_commits()\nremote = read_commits()\nfor message in\
    \ remote:\n    if message not in local:\n        local.append(message)\nfor message in\
    \ local:\n    print(message)\n"
  explanation: pull копирует в локальную историю недостающие удалённые коммиты.
  id: python.github.git-remote.t3
- type: code
  title: push
  difficulty: 2
  context: development
  prompt: Прочитайте локальный список и удалённый. Выведите удалённый после push.
  starter_code: ''
  tests:
  - stdin: '2

      старт склада

      скидка

      1

      старт склада

      '
    expected_stdout: 'старт склада

      скидка

      '
  - stdin: '1

      старт склада

      2

      старт склада

      цены поставки

      '
    expected_stdout: 'старт склада

      цены поставки

      '
  hints:
  - На этот раз дополняется удалённый список.
  - Берёте недостающее из локального.
  - Порядок уже лежавших сообщений сохраняйте.
  solution: "def read_commits():\n    count = int(input())\n    return [input().strip() for\
    \ _ in range(count)]\nlocal = read_commits()\nremote = read_commits()\nfor message in\
    \ local:\n    if message not in remote:\n        remote.append(message)\nfor message in\
    \ remote:\n    print(message)\n"
  explanation: push отправляет на remote коммиты, которых там ещё нет.
  id: python.github.git-remote.t4
- type: code
  title: Сколько заберёт pull
  difficulty: 2
  context: development
  prompt: Прочитайте локальный и удалённый списки. Выведите, сколько сообщений pull добавит
    локально.
  starter_code: ''
  tests:
  - stdin: '1

      старт склада

      2

      старт склада

      цены поставки

      '
    expected_stdout: '1

      '
  - stdin: '2

      старт склада

      скидка

      1

      старт склада

      '
    expected_stdout: '0

      '
  hints:
  - Считайте удалённые сообщения, которых нет локально.
  - Сами списки не печатайте.
  - Ноль — нормальный ответ, если забирать нечего.
  solution: "def read_commits():\n    count = int(input())\n    return [input().strip() for\
    \ _ in range(count)]\nlocal = read_commits()\nremote = read_commits()\nadded = 0\nfor\
    \ message in remote:\n    if message not in local:\n        added += 1\nprint(added)\n"
  explanation: Число равно длине разницы remote минус local.
  id: python.github.git-remote.t5
introduces:
- id: github-pull
  title: git pull и git push
  summary: pull копирует в локальную историю недостающие коммиты remote. push отправляет локальные
    коммиты, которых на remote ещё нет.
