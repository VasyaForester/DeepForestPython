id: python.algorithms.algo-greedy
slug: algo-greedy
section: algorithms
title: Жадные алгоритмы
order: 14
weight: 1
prerequisites:
- python.algorithms.algo-graphs
goal: Разменять сумму монетами 10, 5 и 1 и выбрать непересекающиеся смены.
tags:
- жадный алгоритм
theory:
- Жадный шаг берёт локально лучший кусок и не пересматривает прошлое. Для размена монетами
  10, 5 и 1 сначала берут как можно больше десяток, потом пятёрок, потом единиц. Для этих
  номиналов получается наименьшее число монет.
- Крупная монета здесь всегда выгодна, потому что она собрана из более мелких без остатка.
  Сумму делят на номинал нацело, остаток переносят к следующему номиналу. Количества монет
  всех видов складывают.
- 'Сумма 28 даёт две монеты по 10, одну по 5 и три по 1, всего 6. Сумма 0 даёт 0 монет. Тот
  же принцип у смен склада: брать интервал, который раньше кончается и не пересекается с уже
  взятым.'
examples:
- title: Размен 28
  code: "def coins(amount):\n    count = 0\n    for nominal in (10, 5, 1):\n        count\
    \ = count + amount // nominal\n        amount = amount % nominal\n    return count\nprint(coins(28))\n"
  explanation: Две десятки, одна пятёрка и три единицы дают 6 монет.
- title: Ровно пятёрка
  code: "def coins(amount):\n    count = 0\n    for nominal in (10, 5, 1):\n        count\
    \ = count + amount // nominal\n        amount = amount % nominal\n    return count\nprint(coins(5))\n"
  explanation: Десятка не берётся, одна монета в 5 закрывает сумму.
outcomes:
- брать самый крупный подходящий номинал
- считать монеты 10, 5 и 1
- не пересматривать уже взятые монеты
- выбирать интервал с самым ранним концом
