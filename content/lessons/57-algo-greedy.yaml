  explanation: Жадный размен 28 требует 6 монет.
  code: "def coins(amount):\n    count = 0\n    for nominal in (10, 5, 1):\n        count\
    \ = count + amount // nominal\n        amount = amount % nominal\n    return count\nprint(coins(28))\n"
  id: python.algorithms.algo-greedy.t2
- type: code
  title: Число монет
  difficulty: 2
  context: development
  prompt: Прочитайте сумму. Разменяйте её монетами 10, 5 и 1 жадным способом. Выведите число
    монет.
  starter_code: ''
  tests:
  - stdin: '28

      '
    expected_stdout: '6

      '
  - stdin: '0

      '
    expected_stdout: '0

      '
  hints:
  - Номиналы идут от крупных к мелким.
  - Берите целую часть и остаток.
  - Ноль монет для суммы 0 — нормальный ответ.
  solution: "def coins(amount):\n    count = 0\n    for nominal in (10, 5, 1):\n        count\
    \ = count + amount // nominal\n        amount = amount % nominal\n    return count\nprint(coins(int(input())))\n"
  explanation: Остаток после десяток и пятёрок добирается единицами.
  id: python.algorithms.algo-greedy.t3
- type: code
  title: Сколько десяток
  difficulty: 2
  context: development
  prompt: Прочитайте сумму. Выведите, сколько монет по 10 возьмёт жадный размен. Пятёрки и
    единицы не печатайте.
  starter_code: ''
  tests:
  - stdin: '28

      '
    expected_stdout: '2

      '
  - stdin: '9

      '
    expected_stdout: '0

      '
  hints:
  - Десятка — первый номинал.
  - Нужна целая часть от деления на 10.
  - Остаток в ответ не входит.
  solution: 'amount = int(input())

    print(amount // 10)

    '
  explanation: Число десяток равно сумме, делённой на 10 нацело.
  id: python.algorithms.algo-greedy.t4
- type: code
  title: Смены без наложений
  difficulty: 2
  context: development
  prompt: Прочитайте n, затем n смен как начало и конец. Конец не меньше начала, времена не
    меньше нуля. Возьмите как можно больше непересекающихся смен, каждый раз беря ту, что
    раньше кончается. Соприкосновение конца и начала разрешено. Выведите число смен.
  starter_code: ''
  tests:
  - stdin: '3

      1

      3

      2

      4

      3

      5

      '
    expected_stdout: '2

      '
  - stdin: '2

      0

      5

      1

      4

      '
    expected_stdout: '1

      '
  hints:
  - Сортируйте смены по концу.
  - Берите смену, если она начинается не раньше прошлого конца.
  - Увеличивайте счётчик только при взятии.
  solution: "n = int(input())\nitems = []\nfor _ in range(n):\n    start = int(input())\n\
    \    end = int(input())\n    items.append((end, start))\nitems.sort()\ncount = 0\nlast\
    \ = None\nfor end, start in items:\n    if last is None or start >= last:\n        count\
    \ = count + 1\n        last = end\nprint(count)\n"
  explanation: Ранний конец оставляет больше места следующим сменам.
  id: python.algorithms.algo-greedy.t5
introduces:
