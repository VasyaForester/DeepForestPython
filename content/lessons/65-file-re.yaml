id: python.files.file-re
slug: file-re
section: files
title: Регулярные выражения
order: 7
weight: 1
prerequisites:
- python.files.file-datetime
goal: Находить в строке числа и названия шаблоном re.
tags:
- re
- шаблон
theory:
- Модуль re ищет куски строки по шаблону. re.findall возвращает список всех совпадений. re.search
  возвращает первое либо None, если совпадения нет.
- Шаблон \d+ означает одну или больше цифр. В строке «заказ 14 и 3» findall находит 14 и 3.
  Это строки из цифр, для суммы их превращают в int.
- Шаблон ель|сосна подходит под любое из двух слов. group(0) у результата search возвращает
  найденный текст. Если search вернул None, совпадения не было.
examples:
- title: Все числа
  code: 'import re

    found = re.findall(r''\d+'', ''заказ 14 и 3'')

    print(found[0])

    print(found[1])

    '
  explanation: \d+ забирает последовательности цифр. Первое совпадение — 14, второе — 3.
- title: Первое слово
  code: 'import re

    found = re.search(r''ель|сосна'', ''на складе сосна и ель'')

    print(found.group(0))

    '
  explanation: search останавливается на первом подходящем слове. Здесь это сосна.
outcomes:
- искать все совпадения через findall
- брать первое совпадение через search
- превращать найденные цифры в числа
- проверять, что совпадения не было
