id: python.algorithms.algo-sort
slug: algo-sort
section: algorithms
title: Сортировки
order: 8
weight: 1
prerequisites:
- python.algorithms.algo-binary
goal: Упорядочить цены выбором и сравнить этот способ со sorted.
tags:
- сортировка
theory:
- Сортировка выбором на каждом шаге ищет минимум среди ещё не поставленных цен и меняет его
  с текущей позицией. Внешних шагов около n, и внутри каждого тоже до n сравнений. Поэтому
  оценка такого способа — O(n^2).
- 'Встроенный sorted на длинном журнале делает меньше сравнений: рост около n log n, а не
  квадрат числа цен. На коротком списке разница почти незаметна, на тысячах записей уже важна.
  Учебный выбор минимума полезно один раз написать руками, а в готовом отчёте взять sorted.'
- sorted возвращает новый список и не обязан портить исходный. Сортировка выбором переставляет
  элементы в том же списке. Для цен 40, 7 и 12 оба пути приводят к порядку 7, 12, 40.
examples:
- title: Выбор минимума
  code: "prices = [40, 7, 12]\nfor i in range(len(prices)):\n    best = i\n    for j in range(i\
    \ + 1, len(prices)):\n        if prices[j] < prices[best]:\n            best = j\n   \
    \ prices[i], prices[best] = prices[best], prices[i]\nprint(prices)\n"
  explanation: Минимумы по очереди встают на свои места, получается [7, 12, 40].
- title: Готовая сортировка
  code: 'prices = [40, 7, 12]

    print(sorted(prices))

    '
  explanation: sorted возвращает новый список в том же порядке 7, 12, 40.
outcomes:
- упорядочивать список выбором минимума
- оценивать такой способ как O(n^2)
- получать новый список через sorted
- отличать оценку n log n от квадрата
