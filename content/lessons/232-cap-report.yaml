id: python.capstone.cap-report
slug: cap-report
section: capstone
title: Отчёт
order: 6
weight: 1
prerequisites:
- python.capstone.cap-store
goal: Сложить значения по имени и напечатать итоги по алфавиту.
tags:
- отчёт
- сумма
- имя
theory:
- 'Одно имя может встретиться несколько раз. В отчёте у имени одна строка: само имя и сумма
  его значений.'
- Строки отчёта печатают по имени в алфавитном порядке, а не в порядке первого появления.
  Так сверка не зависит от перемешивания журнала.
- Форма строки — имя и сумма через пробел. Исходные повторы в вывод не попадают.
examples:
- title: Два имени
  code: "rows = [('сосна', 3), ('ель', 2), ('ель', 4)]\ntotals = {}\nfor name, value in rows:\n\
    \    totals[name] = totals.get(name, 0) + value\nfor name in sorted(totals):\n    print(name,\
    \ totals[name])\n"
  explanation: ель складывается в 6 и идёт раньше сосны.
- title: Одно имя
  code: "rows = [('пихта', 4), ('пихта', 1)]\ntotals = {}\nfor name, value in rows:\n    totals[name]\
    \ = totals.get(name, 0) + value\nfor name in sorted(totals):\n    print(name, totals[name])\n"
  explanation: Оба значения пихты дают одну строку пихта 5.
outcomes:
- складывать значения одного имени
- печатать имя и сумму
- сортировать строки по имени
- не повторять имя на каждую исходную запись
resources:
- kind: docs
  title: The Python Tutorial
  url: https://docs.python.org/3/tutorial/index.html
- kind: youtube
  title: CS50P — Lecture 9
  url: https://www.youtube.com/watch?v=5qz5pSO1YTQ
  author: Harvard CS50
tasks:
- type: choice
  title: Как сортировать отчёт
  difficulty: 1
  context: neutral
  prompt: В каком порядке печатают строки отчёта?
  options:
  - id: a
    text: По имени
  - id: b
    text: По убыванию суммы
  - id: c
    text: Как записи шли во вводе
  answer: a
  hints:
  - sorted стоит на именах.
  - Сумма на порядок не влияет.
  - Повтор имени схлопывается раньше печати.
  solution: a
  explanation: Строки отчёта идут по имени.
  id: python.capstone.cap-report.t1
- type: predict_output
  title: Первая строка отчёта
  difficulty: 1
  context: neutral
  prompt: Что будет напечатано первым?
  options:
  - id: a
    text: ель 6
  - id: b
    text: сосна 3
  - id: c
    text: ель 2
  answer: a
  hints:
  - ель раньше сосны по алфавиту.
  - 2 и 4 уже сложены.
  - Первая встреченная сосна не становится первой строкой.
  solution: a
  explanation: Первая строка — ель и её сумма 6.
  code: "rows = [('сосна', 3), ('ель', 2), ('ель', 4)]\ntotals = {}\nfor name, value in rows:\n\
    \    totals[name] = totals.get(name, 0) + value\nfor name in sorted(totals):\n    print(name,\
    \ totals[name])\n"
  id: python.capstone.cap-report.t2
- type: code
  title: Суммы по имени
  difficulty: 2
  context: development
  prompt: Первая строка — количество, дальше «имя значение» или «имя значение статус». Сложите
    значения по имени и выведите имя и сумму, отсортировав по имени.
  starter_code: ''
  tests:
  - stdin: '3

      сосна 1

      ель 2

      ель 3

      '
    expected_stdout: 'ель 5

      сосна 1

      '
  - stdin: '2

      пихта 4 ok

      пихта 1

      '
    expected_stdout: 'пихта 5

      '
  hints:
  - get с нулём начинает новое имя.
  - Статус не входит в сумму.
  - sorted применяется к именам перед печатью.
  solution: "count = int(input())\ntotals = {}\nfor _ in range(count):\n    parts = input().split()\n\
    \    name = parts[0]\n    value = int(parts[1])\n    totals[name] = totals.get(name, 0)\
    \ + value\nfor name in sorted(totals):\n    print(name, totals[name])\n"
  explanation: Повторы одного имени схлопываются в одну строку отчёта.
  id: python.capstone.cap-report.t3
- type: code
  title: Только плюс
  difficulty: 2
  context: development
  prompt: Тот же ввод, но в сумму имени входят только значения больше нуля. Имена без положительных
    значений не печатайте.
  starter_code: ''
  tests:
  - stdin: '3

      сосна -1

      ель 2

      ель 3

      '
    expected_stdout: 'ель 5

      '
  - stdin: '2

      пихта 0

      ель 4

      '
    expected_stdout: 'ель 4

      '
  hints:
  - Отрицательные и ноль пропускайте до словаря.
  - Имя без плюса в отчёт не попадает.
  - Порядок печати всё тот же.
  solution: "count = int(input())\ntotals = {}\nfor _ in range(count):\n    parts = input().split()\n\
    \    value = int(parts[1])\n    if value <= 0:\n        continue\n    name = parts[0]\n\
    \    totals[name] = totals.get(name, 0) + value\nfor name in sorted(totals):\n    print(name,\
    \ totals[name])\n"
  explanation: Отчёт группирует уже отобранные значения.
  id: python.capstone.cap-report.t4
- type: code
  title: Две строки имён
  difficulty: 2
  context: development
  prompt: Сложите все значения по имени. Если имя одно, строка отчёта тоже одна.
  starter_code: ''
  tests:
  - stdin: '1

      ель 9

      '
    expected_stdout: 'ель 9

      '
  - stdin: '2

      сосна 1

      ель 1

      '
    expected_stdout: 'ель 1

      сосна 1

      '
  hints:
  - Одна запись — одна строка.
  - Разные имена сортируйте.
  - Печатайте имя и сумму через пробел.
  solution: "count = int(input())\ntotals = {}\nfor _ in range(count):\n    parts = input().split()\n\
    \    name = parts[0]\n    totals[name] = totals.get(name, 0) + int(parts[1])\nfor name\
    \ in sorted(totals):\n    print(name, totals[name])\n"
  explanation: Даже короткий журнал проходит через группировку.
  id: python.capstone.cap-report.t5
introduces:
- id: cap-group-sum
  title: Сумма по имени
  summary: Все значения одного имени складываются в одну строку отчёта.
