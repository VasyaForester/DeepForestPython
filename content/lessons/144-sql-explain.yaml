id: python.sql.sql-explain
slug: sql-explain
section: sql
title: EXPLAIN
order: 14
weight: 1
prerequisites:
- python.sql.sql-tx
goal: Увидеть, что у запроса есть план, и напечатать выбранное имя.
tags:
- EXPLAIN
- план
theory:
- 'Команда EXPLAIN QUERY PLAN SELECT name FROM trees WHERE name = ''ель'' показывает, как
  SQLite собирается искать строку: полным проходом SCAN или точечным SEARCH. Это не сами данные.'
- Точный текст плана зависит от версии SQLite, поэтому в проверяемых задачах печатают выбранное
  имя, а не слово SCAN или SEARCH. В примере достаточно убедиться, что план не пустой, и напечатать
  есть план.
- Смысл плана в том, чтобы заметить лишний проход по большой таблице. Пока таблица из трёх
  строк, важнее верно написать сам SELECT.
examples:
- title: План не пустой
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.execute("insert into trees values (''ель'', 12)")

    plan = list(con.execute("explain query plan select name from trees where name = ''ель''"))

    print(''есть план'' if plan else ''пусто'')

    '
  explanation: EXPLAIN QUERY PLAN возвращает хотя бы одну строку описания. Её точный текст
    не проверяют.
- title: Само имя
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.execute("insert into trees values (''ель'', 12)")

    row = con.execute("select name from trees where name = ''ель''").fetchone()

    print(row[0])

    '
  explanation: Обычный SELECT возвращает данные. План к этой печати не примешивается.
outcomes:
- отличать план EXPLAIN QUERY PLAN от данных
- не проверять точный текст SCAN или SEARCH
- печатать выбранное имя
- считать строки того же условия
