id: python.basics.arithmetic
slug: arithmetic
section: basics
title: Арифметические выражения
order: 4
weight: 1
prerequisites:
  - python.basics.input
goal: Считать выражения с делением, остатком и степенью и округлять результат.
tags: [арифметика, деление, остаток, степень, round, float]
introduces:
  - id: division
    title: Деление /
    summary: Обычное деление. Результат всегда float, даже если делится нацело. 10 / 5 даёт 2.0.
  - id: floordiv
    title: Целочисленное деление //
    summary: Делит с округлением вниз, к меньшему целому. 17 // 5 даёт 3, а -17 // 5 даёт -4.
  - id: modulo
    title: Остаток %
    summary: Остаток от деления. 17 % 5 даёт 2. Остаток 0 означает, что число делится нацело.
  - id: power
    title: Степень **
    summary: Возведение в степень. 2 ** 10 даёт 1024.
  - id: round
    title: round()
    summary: Округляет число. Половина уходит к ближайшему чётному целому, а не всегда вверх. Второй аргумент задаёт количество знаков после точки.
  - id: abs
    title: abs()
    summary: Возвращает значение без знака. abs(-5) даёт 5.
theory:
  - "Python считает выражения обычными знаками: + сложение, - вычитание, * умножение, / деление. Деление / всегда возвращает float, даже когда делится нацело: 10 / 5 даёт 2.0. Это удобно для среднего и доли."
  - "Два знака // округляют частное вниз, к меньшему целому, а не просто отбрасывают дробную часть. Для 17 // 5 это всё ещё 3, но -17 // 5 даёт -4, не -3. Остаток % подобран так, чтобы выполнялось равенство a == (a // b) * b + (a % b): -17 % 5 равно 3, потому что -4 * 5 + 3 = -17. Запись int(a / b) отбрасывает дробь к нулю и для отрицательных чисел даёт другой результат, поэтому для целых частей нужен //."
  - "Две звёздочки ** возводят в степень: 2 ** 10 равно 1024. Для небольшой степени то же число можно получить повторным умножением, но ** короче и не зависит от того, сколько раз вы умножите вручную. Порядок действий обычный: сначала степень, затем умножение и деление, затем сложение и вычитание. Скобки меняют порядок."
  - "Дробный float и функция round — разные источники сюрприза. 0.1 + 0.2 не равно 0.3, потому что такие дроби хранятся приближённо. Отдельно round на ровной половине идёт к чётному соседу: round(2.5) даёт 2, round(3.5) даёт 4, а не 3 и 4 по школьному правилу «всегда вверх». Для денег позже берут Decimal или целые копейки, а не round от float."
examples:
  - title: Три деления
    code: |
      print(17 / 5)
      print(17 // 5)
      print(17 % 5)
    explanation: Обычное деление даёт 3.4, целочисленное для положительных чисел даёт 3, остаток — 2.
  - title: Деление вниз
    code: |
      print(-17 // 5)
      print(-17 % 5)
    explanation: "Частное равно -4, не -3. Проверка остатка: -4 * 5 + 3 = -17."
  - title: Степень и округление
    code: |
      print(2 ** 10)
      print(0.1 + 0.2)
      print(round(0.1 + 0.2, 2))
      print(round(2.5))
      print(round(3.5))
    explanation: "Сумма 0.1 и 0.2 не равна 0.3 из-за хранения float. Половина в round идёт к чётному целому: 2.5 к 2, 3.5 к 4."
outcomes:
  - считать выражения с четырьмя действиями
  - различать /, // и %
  - возводить в степень
  - округлять результат через round()
resources:
  - kind: docs
    title: Numeric Types — int, float, complex
    url: https://docs.python.org/3/library/stdtypes.html#numeric-types-int-float-complex
  - kind: docs
    title: Floating Point Arithmetic
    url: https://docs.python.org/3/tutorial/floatingpoint.html
  - kind: youtube
    title: CS50P — Lecture 1
    url: https://www.youtube.com/watch?v=CJJQaqN4LCM
    author: Harvard CS50
tasks:
  - id: python.basics.arithmetic.t1
    type: choice
    title: Результат деления
    difficulty: 1
    context: neutral
    prompt: Что выведет print(10 / 5)?
    options:
      - id: a
        text: "2"
      - id: b
        text: "2.0"
      - id: c
        text: "5"
    answer: b
    hints:
      - Знак / всегда даёт дробное число.
      - Целое получилось бы при //.
      - Тип результата здесь float.
    solution: b
    explanation: Деление / возвращает float, поэтому на экране 2.0, а не 2.
  - id: python.basics.arithmetic.t2
    type: predict_output
    title: Остаток
    difficulty: 1
    context: neutral
    prompt: Какое число будет выведено?
    code: |
      x = 9
      print(x % 4)
    options:
      - id: a
        text: "1"
      - id: b
        text: "2"
      - id: c
        text: "2.25"
    answer: a
    hints:
      - В девятке помещаются две четвёрки.
      - После них остаётся остаток.
      - Знак % даёт именно остаток, а не частное.
    solution: a
    explanation: 9 = 4 * 2 + 1, поэтому остаток равен 1.
  - id: python.basics.arithmetic.t9
    type: predict_output
    title: Отрицательное деление
    difficulty: 2
    context: neutral
    prompt: Какое число будет выведено?
    code: |
      print(-17 // 5)
    options:
      - id: a
        text: "-3"
      - id: b
        text: "-4"
      - id: c
        text: "-3.4"
    answer: b
    hints:
      - // округляет к меньшему целому.
      - -3 больше, чем -3.4, поэтому это ещё не округление вниз.
      - Ближайшее меньшее целое для -3.4 — это -4.
    solution: b
    explanation: -17 / 5 равно -3.4. Округление вниз даёт -4, а не -3.
  - id: python.basics.arithmetic.t3
    type: predict_output
    title: Порядок действий
    difficulty: 2
    context: neutral
    prompt: Что выведет этот код?
    code: |
      print(2 + 3 * 4)
    options:
      - id: a
        text: "14"
      - id: b
        text: "20"
      - id: c
        text: "24"
    answer: a
    hints:
      - Умножение выполняется раньше сложения.
      - Скобок здесь нет.
      - Сначала считается 3 * 4.
    solution: a
    explanation: Сначала 3 * 4, затем прибавляется 2. Чтобы получить 20, нужны скобки.
  - id: python.basics.arithmetic.t4
    type: code
    title: Стоимость заказа
    difficulty: 2
    context: business
    prompt: Первая строка ввода — цена за штуку (целое число), вторая — количество. Выведите стоимость заказа.
    starter_code: ""
    tests:
      - stdin: "250\n4\n"
        expected_stdout: "1000\n"
      - stdin: "99\n3\n"
        expected_stdout: "297\n"
    hints:
      - Обе строки нужно преобразовать в int.
      - Стоимость — произведение цены и количества.
      - Выводится одно число.
    solution: |
      price = int(input())
      count = int(input())
      print(price * count)
    explanation: Числа умножаются уже после преобразования, поэтому результат остаётся целым.
  - id: python.basics.arithmetic.t5
    type: code
    title: Часы и минуты
    difficulty: 3
    context: analytics
    prompt: На вход приходит число минут. Выведите на первой строке целое число часов, на второй — оставшиеся минуты.
    starter_code: |
      minutes = int(input())
    tests:
      - stdin: "135\n"
        expected_stdout: "2\n15\n"
      - stdin: "59\n"
        expected_stdout: "0\n59\n"
    hints:
      - В часе 60 минут.
      - Целое число часов даёт //.
      - Остаток минут даёт %.
    solution: |
      minutes = int(input())
      print(minutes // 60)
      print(minutes % 60)
    explanation: Целочисленное деление даёт полные часы, остаток — минуты сверх них.
  - id: python.basics.arithmetic.t6
    type: code
    title: Среднее за три дня
    difficulty: 3
    context: analytics
    prompt: Прочитайте три целых числа с трёх строк и выведите их среднее, округлённое до двух знаков после точки.
    starter_code: ""
    tests:
      - stdin: "1\n2\n4\n"
        expected_stdout: "2.33\n"
      - stdin: "2\n2\n2\n"
        expected_stdout: "2.0\n"
    hints:
      - Среднее — сумма, делённая на количество.
      - Деление / уже даёт float.
      - round с двумя знаками округляет результат.
    solution: |
      a = int(input())
      b = int(input())
      c = int(input())
      print(round((a + b + c) / 3, 2))
    explanation: round убирает лишние знаки. Ровное среднее печатается как 2.0, потому что деление дало float.
  - id: python.basics.arithmetic.t7
    type: code
    title: Почините подсчёт коробок
    difficulty: 3
    context: development
    prompt: В коробку помещается 3 детали. Программа должна вывести, сколько коробок заполнено целиком. Сейчас она печатает дробное число. Исправьте код.
    starter_code: |
      items = int(input())
      print(items / 3)
    tests:
      - stdin: "10\n"
        expected_stdout: "3\n"
      - stdin: "9\n"
        expected_stdout: "3\n"
    hints:
      - Коробок не бывает дробное число.
      - Нужна целая часть деления.
      - Замените / на //.
    solution: |
      items = int(input())
      print(items // 3)
    explanation: Для неотрицательных чисел // оставляет только целые коробки. Неполная коробка в ответ не входит.
  - id: python.basics.arithmetic.t8
    type: code
    title: Отклонение от нормы
    difficulty: 3
    context: security
    prompt: Первая строка — измеренное значение, вторая — норма. Оба числа дробные. Выведите размер отклонения без знака, округлённый до одного знака после точки.
    starter_code: ""
    tests:
      - stdin: "18.4\n20.0\n"
        expected_stdout: "1.6\n"
      - stdin: "21.5\n20.0\n"
        expected_stdout: "1.5\n"
    hints:
      - Преобразуйте обе строки через float.
      - Разность может получиться отрицательной.
      - abs убирает знак, round оставляет один знак.
    solution: |
      value = float(input())
      norm = float(input())
      print(round(abs(value - norm), 1))
    explanation: abs делает отклонение положительным независимо от того, выше измерение нормы или ниже.
