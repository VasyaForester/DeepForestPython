id: python.backend.be-db
slug: be-db
section: backend
title: База рядом с маршрутом
order: 7
weight: 1
prerequisites:
- python.backend.be-async
goal: Записать строку в sqlite3 в памяти и напечатать её обратно.
tags:
- sqlite3
- таблица
- запрос
theory:
- 'Рядом с маршрутом данные можно держать в sqlite3. Соединение :memory: живёт до конца программы
  и не создаёт файл.'
- Таблица создаётся в коде урока. Вставка передаёт значения отдельно от текста запроса, затем
  select читает ту же строку.
- Программа печатает поля выбранной строки. Так видно, что запись действительно попала в таблицу,
  а не осталась только в переменной.
examples:
- title: Одна позиция
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table goods(name text, price integer)'')

    con.execute(''insert into goods(name, price) values (?, ?)'', (''ель'', 120))

    row = con.execute(''select name, price from goods'').fetchone()

    print(row[0])

    print(row[1])

    '
  explanation: Вставка кладёт ель и 120, select возвращает ту же пару.
- title: Две строки
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table goods(name text, price integer)'')

    con.execute(''insert into goods(name, price) values (?, ?)'', (''ель'', 120))

    con.execute(''insert into goods(name, price) values (?, ?)'', (''сосна'', 80))

    print(con.execute(''select count(*) from goods'').fetchone()[0])

    '
  explanation: В таблице две строки, count возвращает 2.
outcomes:
- открывать sqlite3 в памяти
- создавать таблицу и вставлять строку
- читать строку через select
- печатать поля, полученные из базы
