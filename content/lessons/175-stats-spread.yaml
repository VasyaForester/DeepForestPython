id: python.stats.stats-spread
slug: stats-spread
section: stats
title: Дисперсия
order: 4
weight: 1
prerequisites:
- python.stats.stats-dist
goal: Считать разброс вокруг среднего по названной формуле.
tags:
- дисперсия
theory:
- 'Дисперсия измеряет разброс вокруг среднего. Популяционная делит сумму квадратов отклонений
  на n: так описывают весь данный набор, а не вывод на более широкий парк.'
- Выборочная делит ту же сумму на n - 1. Она больше, потому что выборка обычно приукрашивает
  близость к своему среднему. В каждом задании сказано, какой делитель брать.
- Числа подобраны так, что результат целый. Модуль statistics не используется, длинную дробь
  печатать не нужно.
examples:
- title: Популяционная
  code: 'values = [1, 2, 3, 4, 5]

    mean = sum(values) // len(values)

    square = sum((value - mean) ** 2 for value in values)

    print(square // len(values))

    '
  explanation: Среднее 3, сумма квадратов 10, деление на 5 даёт популяционную дисперсию 2.
- title: Выборочная
  code: 'values = [0, 2, 4]

    mean = sum(values) // len(values)

    square = sum((value - mean) ** 2 for value in values)

    print(square // (len(values) - 1))

    '
  explanation: Сумма квадратов 8, делитель n-1 равен 2. Выборочная дисперсия 4.
outcomes:
- считать сумму квадратов отклонений
- делить на n для популяционной дисперсии
- делить на n - 1 для выборочной
- называть, какой делитель выбран
resources:
