tasks:
- type: choice
  title: Какой делитель
  difficulty: 1
  context: neutral
  prompt: Чем выборочная дисперсия отличается от популяционной в этом уроке?
  options:
  - id: a
    text: Выборочная делит сумму квадратов на n - 1, популяционная на n
  - id: b
    text: Они всегда равны нулю
  - id: c
    text: Выборочная не использует среднее
  answer: a
  hints:
  - Сумма квадратов общая.
  - Меняется делитель.
  - Среднее нужно обеим.
  solution: a
  explanation: Название дисперсии обязано называть делитель.
  id: python.stats.stats-spread.t1
- type: predict_output
  title: Популяционная двойка
  difficulty: 1
  context: neutral
  prompt: Что напечатает программа?
  options:
  - id: a
    text: '2'
  - id: b
    text: '10'
  - id: c
    text: '3'
  answer: a
  hints:
  - Сначала сумма квадратов 10.
  - Делитель n равен 5.
  - 10 // 5 = 2.
  solution: a
  explanation: Популяционная дисперсия равна 2.
  code: 'values = [1, 2, 3, 4, 5]

    mean = sum(values) // len(values)

    square = sum((value - mean) ** 2 for value in values)

    print(square // len(values))

    '
  id: python.stats.stats-spread.t2
- type: code
  title: Популяционная дисперсия
  difficulty: 2
  context: development
  prompt: Прочитайте n и n чисел. Среднее целое, сумма квадратов делится на n. Выведите популяционную
    дисперсию.
  starter_code: ''
  tests:
  - stdin: '4

      1

      3

      5

      7

      '
    expected_stdout: '5

      '
  - stdin: '5

      1

      2

      3

      4

      5

      '
    expected_stdout: '2

      '
  hints:
  - Вычтите среднее из каждого числа.
  - Возведите отклонения в квадрат и сложите.
  - Поделите на n, не на n - 1.
  solution: 'n = int(input())

    values = [int(input()) for _ in range(n)]

    mean = sum(values) // n

    square = sum((value - mean) ** 2 for value in values)

    print(square // n)

    '
  explanation: 'Делитель n означает: набор описан целиком.'
  id: python.stats.stats-spread.t3
- type: code
  title: Выборочная дисперсия
  difficulty: 2
  context: development
  prompt: Прочитайте n и n чисел, n не меньше 2. Среднее целое, сумма квадратов делится на
    n - 1. Выведите выборочную дисперсию.
  starter_code: ''
  tests:
  - stdin: '3

      0

      2

      4

      '
    expected_stdout: '4

      '
  - stdin: '5

      5

      5

      5

      5

      5

      '
    expected_stdout: '0

      '
  hints:
  - Делитель равен n - 1.
  - Одинаковые числа дают 0.
  - Среднее вычитайте до квадрата.
  solution: 'n = int(input())

    values = [int(input()) for _ in range(n)]

    mean = sum(values) // n

    square = sum((value - mean) ** 2 for value in values)

    print(square // (n - 1))

    '
  explanation: Делитель n - 1 помечает, что набор считают выборкой.
  id: python.stats.stats-spread.t4
- type: code
  title: Сумма квадратов
  difficulty: 2
  context: development
  prompt: Прочитайте n и n чисел с целым средним. Выведите сумму квадратов отклонений от среднего,
    ещё без деления.
  starter_code: ''
  tests:
  - stdin: '5

      1

      2

      3

      4

      5

      '
    expected_stdout: '10

      '
  - stdin: '3

      4

      4

      4

      '
    expected_stdout: '0

      '
  hints:
  - Квадрат отклонения неотрицателен.
  - Делить эту сумму пока не нужно.
  - Одинаковые числа дают 0.
  solution: 'n = int(input())

    values = [int(input()) for _ in range(n)]

    mean = sum(values) // n

    print(sum((value - mean) ** 2 for value in values))

    '
  explanation: Числитель общий для обеих дисперсий.
  id: python.stats.stats-spread.t5
