id: python.capstone.cap-parse
slug: cap-parse
section: capstone
title: Разбор записей
order: 3
weight: 1
prerequisites:
- python.capstone.cap-arch
goal: Разрезать строки журнала и посчитать, сколько из них удалось оставить.
tags:
- разбор
- строка
- счётчик
theory:
- Строка журнала — имя и число, иногда ещё слово статуса. Берут первые два поля. Статус на
  подсчёт не влияет.
- 'Плохую строку пропускают: если полей меньше двух или второе поле не целое число. Такая
  строка в журнал не входит.'
- Программа печатает одно число — сколько строк удалось разобрать. Имена на этом шаге не нужны,
  важен счётчик годных записей.
examples:
- title: Три строки
  code: "lines = ['ель 2', 'битая', 'сосна 1 ok']\nkept = 0\nfor line in lines:\n    parts\
    \ = line.split()\n    if len(parts) < 2:\n        continue\n    try:\n        int(parts[1])\n\
    \    except ValueError:\n        continue\n    kept += 1\nprint(kept)\n"
  explanation: битая без числа пропущена, две остальные строки засчитаны.
- title: Число не разобралось
  code: "lines = ['ель x', 'пихта 4']\nkept = 0\nfor line in lines:\n    parts = line.split()\n\
    \    if len(parts) < 2:\n        continue\n    try:\n        int(parts[1])\n    except\
    \ ValueError:\n        continue\n    kept += 1\nprint(kept)\n"
  explanation: Буква вместо числа отбрасывается, остаётся одна запись.
outcomes:
- резать строку на поля
- пропускать строку без числа
- игнорировать слово статуса
- печатать число разобранных строк
resources:
- kind: docs
  title: The Python Tutorial
  url: https://docs.python.org/3/tutorial/index.html
- kind: youtube
  title: CS50P — Lecture 9
  url: https://www.youtube.com/watch?v=5qz5pSO1YTQ
  author: Harvard CS50
tasks:
- type: choice
  title: Какую строку пропускать
  difficulty: 1
  context: neutral
  prompt: Какая строка журнала не считается разобранной?
  options:
  - id: a
    text: В ней меньше двух полей или второе поле не целое число
  - id: b
    text: В ней три поля, включая статус
  - id: c
    text: В ней положительное число
  answer: a
  hints:
  - Статус как третье слово не мешает.
  - Нужны имя и целое значение.
  - Знак числа на этом шаге ещё не проверяют.
  solution: a
  explanation: Пропуск — это битая форма строки, а не маленькое число.
  id: python.capstone.cap-parse.t1
- type: predict_output
  title: Сколько годных
  difficulty: 1
  context: neutral
  prompt: Что напечатает программа?
  options:
  - id: a
    text: '2'
  - id: b
    text: '3'
  - id: c
    text: '1'
  answer: a
  hints:
  - битая не даёт второго поля.
  - Статус ok у сосны не мешает int.
  - Счётчик растёт дважды.
  solution: a
  explanation: Годными оказались две строки.
  code: "lines = ['ель 2', 'битая', 'сосна 1 ok']\nkept = 0\nfor line in lines:\n    parts\
    \ = line.split()\n    if len(parts) < 2:\n        continue\n    try:\n        int(parts[1])\n\
    \    except ValueError:\n        continue\n    kept += 1\nprint(kept)\n"
  id: python.capstone.cap-parse.t2
- type: code
  title: Счётчик строк
  difficulty: 2
  context: development
  prompt: Первая строка — сколько строк журнала, дальше сами строки. Пропустите битые и выведите,
    сколько строк разобрано.
  starter_code: ''
  tests:
  - stdin: '3

      ель 2

      битая

      сосна 1 ok

      '
    expected_stdout: '2

      '
  - stdin: '2

      ель x

      пихта 4

      '
    expected_stdout: '1

      '
  hints:
  - Третье слово можно не смотреть.
  - int внутри try ловит нечисло.
  - continue не увеличивает счётчик.
  solution: "count = int(input())\nkept = 0\nfor _ in range(count):\n    parts = input().split()\n\
    \    if len(parts) < 2:\n        continue\n    try:\n        int(parts[1])\n    except\
    \ ValueError:\n        continue\n    kept += 1\nprint(kept)\n"
  explanation: В ответе только число годных строк.
  id: python.capstone.cap-parse.t3
- type: code
  title: Все битые
  difficulty: 2
  context: development
  prompt: Тот же формат. Если ни одна строка не разобралась, выведите 0.
  starter_code: ''
  tests:
  - stdin: '2

      битая

      ещё

      '
    expected_stdout: '0

      '
  - stdin: '1

      ель 5

      '
    expected_stdout: '1

      '
  hints:
  - Ноль — нормальный ответ.
  - Одна годная строка даёт 1.
  - Пустые по смыслу слова не становятся нулём.
  solution: "count = int(input())\nkept = 0\nfor _ in range(count):\n    parts = input().split()\n\
    \    if len(parts) < 2:\n        continue\n    try:\n        int(parts[1])\n    except\
    \ ValueError:\n        continue\n    kept += 1\nprint(kept)\n"
  explanation: Счётчик остаётся нулём, пока не встретится пара имя и целое.
  id: python.capstone.cap-parse.t4
- type: code
  title: Функция разбора
  difficulty: 2
  context: development
  prompt: accepted(text) возвращает True, если строка разбирается. Прочитайте N строк и напечатайте,
    сколько раз функция вернула True.
  starter_code: ''
  tests:
  - stdin: '2

      сосна 3 ok

      ель

      '
    expected_stdout: '1

      '
  - stdin: '2

      ель 1

      пихта 2

      '
    expected_stdout: '2

      '
  hints:
  - False не увеличивает счётчик.
  - Статус в третьем поле не мешает.
  - Печатайте только kept.
  solution: "def accepted(text):\n    parts = text.split()\n    if len(parts) < 2:\n     \
    \   return False\n    try:\n        int(parts[1])\n    except ValueError:\n        return\
    \ False\n    return True\ncount = int(input())\nkept = 0\nfor _ in range(count):\n   \
    \ if accepted(input()):\n        kept += 1\nprint(kept)\n"
  explanation: Правило годной строки собрано в функции, цикл только считает.
  id: python.capstone.cap-parse.t5
introduces:
- id: cap-skip-bad
  title: Битая строка
  summary: Строка журнала без двух полей или с нецелым значением. Её не включают в счёт.
