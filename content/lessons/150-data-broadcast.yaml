id: python.data.data-broadcast
slug: data-broadcast
section: data
title: Broadcasting
order: 5
weight: 1
prerequisites:
- python.data.data-index
goal: Прибавлять число к каждой ячейке без отдельной формулы на ячейку.
tags:
- broadcasting
- numpy
theory:
- 'Broadcasting в NumPy позволяет написать arr + 3: тройка растягивается на каждую ячейку,
  и цикл на Python не нужен.'
- Формы должны быть совместимы. Число совместимо с любой формой. Две строки разной длины NumPy
  так не сложит.
- Упражнение прибавляет число списковым включением, потому что NumPy нет в среде браузера.
examples:
- title: Плюс два метра
  code: 'heights = [12, 9, 15]

    shifted = [h + 2 for h in heights]

    print(shifted[0], shifted[1], shifted[2])

    '
  explanation: 'К каждой высоте прибавили 2: 14, 11 и 17.'
- title: Скидка на все цены
  code: 'prices = [[100, 80], [50, 40]]

    cut = [[cell - 10 for cell in row] for row in prices]

    print(cut[0][1])

    print(cut[1][0])

    '
  explanation: 10 вычли из каждой цены. Показаны 70 и 40.
outcomes:
- прибавлять число ко всем ячейкам
- понимать broadcasting как растягивание числа
- не менять форму при сдвиге
- считать сумму уже сдвинутых значений
resources:
- kind: docs
  title: csv
  url: https://docs.python.org/3/library/csv.html
- kind: youtube
  title: CS50P — Lecture 6
  url: https://www.youtube.com/watch?v=z9cz-sS9a1A
  author: Harvard CS50
tasks:
- type: choice
  title: Плюс число в NumPy
  difficulty: 1
  context: neutral
  prompt: Что делает arr + 3 для массива NumPy?
  options:
  - id: a
    text: Прибавляет 3 к каждой ячейке
  - id: b
    text: Прибавляет 3 только к первой ячейке
  - id: c
    text: Увеличивает число строк на 3
  answer: a
  hints:
  - Число растягивается на форму массива.
  - Первая ячейка не особая.
  - Форма от сложения с числом не меняется.
  solution: a
  explanation: Это и есть broadcasting числа на массив.
  id: python.data.data-broadcast.t1
- type: predict_output
  title: Сдвиг высоты
  difficulty: 1
  context: neutral
  prompt: Что напечатает программа?
  options:
  - id: a
    text: '9'
  - id: b
    text: '12'
  - id: c
    text: '15'
  answer: b
  hints:
  - Берётся вторая высота.
  - К ней прибавляют 3.
  - 9 + 3 = 12.
  solution: b
  explanation: Вторая высота стала 12.
  code: 'heights = [12, 9, 15]

    print(heights[1] + 3)

    '
  id: python.data.data-broadcast.t2
- type: code
  title: Прибавить ко всем
  difficulty: 2
  context: development
  prompt: Прочитайте n, затем число k, затем n высот. Выведите каждую высоту плюс k.
  starter_code: ''
  tests:
  - stdin: '3

      2

      12

      9

      15

      '
    expected_stdout: '14

      11

      17

      '
  - stdin: '1

      5

      7

      '
    expected_stdout: '12

      '
  hints:
  - k одно на все строки.
  - Прибавляйте его в цикле или включении.
  - Сохраняйте порядок высот.
  solution: "n = int(input())\nk = int(input())\nfor _ in range(n):\n    print(int(input())\
    \ + k)\n"
  explanation: Одно число применяется к каждой высоте, как broadcasting.
  id: python.data.data-broadcast.t3
- type: code
  title: Сумма после сдвига
  difficulty: 2
  context: development
  prompt: Прочитайте n, k и n цен. Прибавьте k к каждой цене и выведите сумму новых цен.
  starter_code: ''
  tests:
  - stdin: '3

      10

      100

      80

      50

      '
    expected_stdout: '260

      '
  - stdin: '2

      0

      4

      6

      '
    expected_stdout: '10

      '
  hints:
  - Сдвиньте каждую цену.
  - Потом сложите.
  - k может быть нулём.
  solution: 'n = int(input())

    k = int(input())

    prices = [int(input()) + k for _ in range(n)]

    print(sum(prices))

    '
  explanation: Сумма выросла на k, умноженное на число цен.
  id: python.data.data-broadcast.t4
- type: code
  title: Сетка плюс число
  difficulty: 2
  context: development
  prompt: Прочитайте размеры, сетку и число k. Выведите сумму всех ячеек после прибавления
    k.
  starter_code: ''
  tests:
  - stdin: '2 2

      1 2

      3 4

      10

      '
    expected_stdout: '50

      '
  - stdin: '1 3

      5 5 5

      1

      '
    expected_stdout: '18

      '
  hints:
  - Сложите исходные ячейки.
  - k добавляется к каждой.
  - Ячеек ровно rows * cols.
  solution: "rows, cols = map(int, input().split())\ntotal = 0\nfor _ in range(rows):\n  \
    \  for cell in input().split():\n        total += int(cell)\nk = int(input())\nprint(total\
    \ + k * rows * cols)\n"
  explanation: Тот же результат, что у прибавления k к каждой ячейке.
  id: python.data.data-broadcast.t5
introduces:
- id: data-broadcast
  title: Broadcasting
  summary: Растягивание числа или меньшего массива на форму большего. В NumPy arr + 3 обходится
    без цикла Python.
