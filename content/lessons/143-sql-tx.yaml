id: python.sql.sql-tx
slug: sql-tx
section: sql
title: Транзакции
order: 13
weight: 1
prerequisites:
- python.sql.sql-normal
goal: Убедиться, что откат отменяет вставку, а фиксация оставляет её.
tags:
- COMMIT
- ROLLBACK
- транзакция
theory:
- Транзакция собирает несколько изменений в один шаг. COMMIT фиксирует их, ROLLBACK отменяет.
  После отката вставленного дуба в таблице не видно.
- Изоляция решает, видят ли другие соединения ещё не зафиксированные строки. В SQLite чтение
  обычно видит снимок, а не чужой незавершённый INSERT. Задачи идут в одном соединении и показывают
  именно откат и фиксацию.
- Начальные ель и сосна фиксируют до эксперимента. Иначе откат унёс бы и их. Новая строка
  — дуб высотой 30.
examples:
- title: Откат дуба
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.execute("insert into trees values (''ель'', 12)")

    con.commit()

    con.execute("insert into trees values (''дуб'', 30)")

    con.rollback()

    print(con.execute("select count(*) from trees where name = ''дуб''").fetchone()[0])

    '
  explanation: ROLLBACK отменяет незафиксированную вставку, дуба в таблице нет.
- title: Фиксация дуба
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.execute("insert into trees values (''ель'', 12)")

    con.commit()

    con.execute("insert into trees values (''дуб'', 30)")

    con.commit()

    print(con.execute("select count(*) from trees where name = ''дуб''").fetchone()[0])

    '
  explanation: После COMMIT строка дуба остаётся, счётчик равен 1.
outcomes:
- фиксировать изменения через COMMIT
- отменять незафиксированный INSERT через ROLLBACK
- не откатывать уже зафиксированные строки
- понимать, что изоляция скрывает чужие незавершённые правки
