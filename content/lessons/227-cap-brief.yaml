id: python.capstone.cap-brief
slug: cap-brief
section: capstone
title: Постановка
order: 1
weight: 1
prerequisites:
- python.vibe.vibe-review
goal: Прочитать название и напечатать цель журнала.
tags:
- цель
- журнал
- название
theory:
- Программа журнала читает записи, отбирает нужные, складывает значения и печатает отчёт.
  Это и есть цель, её фиксируют до кода.
- Запись — строка из имени и числа, иногда с третьим словом статуса. Плохую строку позже отбрасывают,
  отрицательное значение не входит в сумму.
- В этом шаге читают одну строку названия и печатают цель целиком. Название подставляется
  в фразу, чтобы было видно, чей журнал собирают.
examples:
- title: Журнал склада
  code: 'title = ''Журнал склада''

    print(''Программа «'' + title + ''» читает записи, отбирает, складывает и печатает отчёт.'')

    '
  explanation: Название встаёт в готовую фразу о чтении, отборе, сумме и отчёте.
- title: Смена
  code: 'title = ''Смена''

    print(''Программа «'' + title + ''» читает записи, отбирает, складывает и печатает отчёт.'')

    '
  explanation: Та же цель, другое название внутри кавычек-ёлочек.
outcomes:
- формулировать цель до разбора записей
- подставлять название в фразу
- называть чтение, отбор, сумму и отчёт
- печатать цель одной строкой
resources:
- kind: docs
  title: The Python Tutorial
  url: https://docs.python.org/3/tutorial/index.html
- kind: youtube
  title: CS50P — Lecture 9
  url: https://www.youtube.com/watch?v=5qz5pSO1YTQ
  author: Harvard CS50
tasks:
- type: choice
  title: Что должна сделать программа
  difficulty: 1
  context: neutral
  prompt: Какая цель у разбора журнала?
  options:
  - id: a
    text: Читать записи, отбирать, складывать и печатать отчёт
  - id: b
    text: Только сохранить название в файл
  - id: c
    text: Сразу нарисовать график
  answer: a
  hints:
  - Название — только подпись.
  - Дальше нужны записи и сумма.
  - Отчёт печатают текстом.
  solution: a
  explanation: Цель — прочитать записи, отобрать, сложить и напечатать отчёт.
  id: python.capstone.cap-brief.t1
- type: predict_output
  title: Фраза цели
  difficulty: 1
  context: neutral
  prompt: Что напечатает программа?
  options:
  - id: a
    text: Программа «Смена» читает записи, отбирает, складывает и печатает отчёт.
  - id: b
    text: Смена
  - id: c
    text: читает записи
  answer: a
  hints:
  - Название стоит внутри фразы.
  - Остальной текст фиксирован.
  - Печатается одна строка.
  solution: a
  explanation: На экран выходит полная цель с названием Смена.
  code: 'title = ''Смена''

    print(''Программа «'' + title + ''» читает записи, отбирает, складывает и печатает отчёт.'')

    '
  id: python.capstone.cap-brief.t2
- type: code
  title: Название из ввода
  difficulty: 2
  context: development
  prompt: 'Прочитайте название и напечатайте: Программа «название» читает записи, отбирает,
    складывает и печатает отчёт.'
  starter_code: ''
  tests:
  - stdin: 'Журнал склада

      '
    expected_stdout: 'Программа «Журнал склада» читает записи, отбирает, складывает и печатает
      отчёт.

      '
  - stdin: 'Смена

      '
    expected_stdout: 'Программа «Смена» читает записи, отбирает, складывает и печатает отчёт.

      '
  hints:
  - Название берите из input как есть.
  - Ёлочки стоят вокруг названия.
  - Фраза после названия не меняется.
  solution: 'title = input()

    print(''Программа «'' + title + ''» читает записи, отбирает, складывает и печатает отчёт.'')

    '
  explanation: Одна строка связывает название с целью журнала.
  id: python.capstone.cap-brief.t3
- type: code
  title: Короткое имя
  difficulty: 2
  context: development
  prompt: Та же фраза. Название может быть одним словом.
  starter_code: ''
  tests:
  - stdin: 'Склад

      '
    expected_stdout: 'Программа «Склад» читает записи, отбирает, складывает и печатает отчёт.

      '
  - stdin: 'Ночная смена

      '
    expected_stdout: 'Программа «Ночная смена» читает записи, отбирает, складывает и печатает
      отчёт.

      '
  hints:
  - Пробел в названии оставляйте.
  - Не режьте строку на слова.
  - Кавычки-ёлочки не заменяйте на обычные.
  solution: 'title = input()

    print(''Программа «'' + title + ''» читает записи, отбирает, складывает и печатает отчёт.'')

    '
  explanation: Длинное и короткое название подставляются одним и тем же способом.
  id: python.capstone.cap-brief.t4
- type: code
  title: Функция цели
  difficulty: 2
  context: development
  prompt: Функция goal(title) возвращает готовую фразу. Прочитайте название и напечатайте
    результат.
  starter_code: ''
  tests:
  - stdin: 'Журнал

      '
    expected_stdout: 'Программа «Журнал» читает записи, отбирает, складывает и печатает отчёт.

      '
  - stdin: 'Утро

      '
    expected_stdout: 'Программа «Утро» читает записи, отбирает, складывает и печатает отчёт.

      '
  hints:
  - return собирает строку.
  - print снаружи один.
  - Текст цели не сокращайте.
  solution: "def goal(title):\n    return 'Программа «' + title + '» читает записи, отбирает,\
    \ складывает и печатает отчёт.'\nprint(goal(input()))\n"
  explanation: Формулировка цели собрана в функции и не зависит от конкретного названия.
  id: python.capstone.cap-brief.t5
introduces:
