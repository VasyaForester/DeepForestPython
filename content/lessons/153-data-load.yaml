id: python.data.data-load
slug: data-load
section: data
title: Загрузка CSV
order: 8
weight: 1
prerequisites:
- python.data.data-frame
goal: Разбирать строки имя,значение и понимать, что делает read_csv.
tags:
- csv
- read_csv
theory:
- 'CSV хранит таблицу текстом: запятая делит поля, перевод строки делит записи. pandas читает
  файл вызовом pd.read_csv.'
- 'Модуль csv в стандартной библиотеке делает то же чтение без pandas: DictReader отдаёт каждую
  строку словарём. Заголовок становится ключами.'
- Упражнение разбирает строки вида имя,значение из ввода, потому что pandas нет в среде браузера
  и отдельный файл не нужен.
examples:
- title: Текст таблицы
  code: 'import csv

    import io

    text = "порода,высота\nель,12\nсосна,9\n"

    table = list(csv.DictReader(io.StringIO(text)))

    print(table[0]["порода"])

    print(int(table[1]["высота"]))

    '
  explanation: DictReader берёт заголовок из первой строки. Высота приходит текстом и превращается
    в int.
- title: Сумма из текста
  code: 'import csv

    import io

    text = "товар,цена\nель,400\nсосна,250\n"

    table = list(csv.DictReader(io.StringIO(text)))

    print(int(table[0]["цена"]) + int(table[1]["цена"]))

    '
  explanation: Две цены из CSV-текста складываются в 650.
outcomes:
- делить CSV-строку по запятой
- понимать, что делает pd.read_csv
- читать таблицу модулем csv из текста
- не требовать внешний файл для разбора строк
