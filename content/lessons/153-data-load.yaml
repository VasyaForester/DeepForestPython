tasks:
- type: choice
  title: Что делает read_csv
  difficulty: 1
  context: neutral
  prompt: 'Фрагмент pandas: df = pd.read_csv(''trees.csv''). Что делает этот вызов?'
  options:
  - id: a
    text: Читает CSV-файл в таблицу
  - id: b
    text: Рисует столбцы высот
  - id: c
    text: Удаляет повторы строк
  answer: a
  hints:
  - Имя метода говорит о чтении.
  - График здесь не строится.
  - Файл превращается в таблицу.
  solution: a
  explanation: read_csv загружает таблицу из текста с разделителями.
  id: python.data.data-load.t1
- type: predict_output
  title: Вторая цена
  difficulty: 1
  context: neutral
  prompt: Что напечатает программа?
  options:
  - id: a
    text: сосна
  - id: b
    text: '250'
  - id: c
    text: '0'
  answer: b
  hints:
  - split режет по запятой.
  - Второе поле — цена.
  - int убирает текстовый вид числа.
  solution: b
  explanation: Цена в строке равна 250.
  code: 'line = "сосна,250"

    name, price = line.split(",")

    print(int(price))

    '
  id: python.data.data-load.t2
- type: code
  title: Сумма значений
  difficulty: 2
  context: development
  prompt: Прочитайте n, затем n строк вида имя,значение. Выведите сумму значений.
  starter_code: ''
  tests:
  - stdin: '3

      ель,12

      сосна,9

      берёза,15

      '
    expected_stdout: '36

      '
  - stdin: '1

      дуб,8

      '
    expected_stdout: '8

      '
  hints:
  - Режьте строку по запятой.
  - Имя можно не печатать.
  - Складывайте целые значения.
  solution: "n = int(input())\ntotal = 0\nfor _ in range(n):\n    name, value = input().split(\"\
    ,\")\n    total += int(value)\nprint(total)\n"
  explanation: Каждая строка ввода — одна запись без отдельного файла.
  id: python.data.data-load.t3
- type: code
  title: Имя максимума
  difficulty: 2
  context: development
  prompt: Прочитайте n строк имя,значение. Выведите имя с наибольшим значением. При равенстве
    оставьте первое.
  starter_code: ''
  tests:
  - stdin: '3

      ель,12

      сосна,9

      берёза,15

      '
    expected_stdout: 'берёза

      '
  - stdin: '2

      дуб,8

      клён,8

      '
    expected_stdout: 'дуб

      '
  hints:
  - Храните имя вместе со значением.
  - Строгое сравнение сохраняет первое равенство.
  - Печатайте имя, не число.
  solution: "n = int(input())\nbest_name = \"\"\nbest_value = -1\nfor _ in range(n):\n   \
    \ name, value = input().split(\",\")\n    value = int(value)\n    if value > best_value:\n\
    \        best_name = name\n        best_value = value\nprint(best_name)\n"
  explanation: Разбор запятой даёт оба поля записи.
  id: python.data.data-load.t4
- type: code
  title: Сколько выше порога
  difficulty: 2
  context: development
  prompt: Первая строка — порог, вторая — n, дальше строки имя,значение. Выведите, сколько
    значений строго больше порога.
  starter_code: ''
  tests:
  - stdin: '10

      3

      ель,12

      сосна,9

      берёза,15

      '
    expected_stdout: '2

      '
  - stdin: '20

      2

      дуб,20

      клён,21

      '
    expected_stdout: '1

      '
  hints:
  - Порог читается до записей.
  - Сравнивайте только значение.
  - Равенство порогу не считается.
  solution: "limit = int(input())\nn = int(input())\ncount = 0\nfor _ in range(n):\n    name,\
    \ value = input().split(\",\")\n    if int(value) > limit:\n        count += 1\nprint(count)\n"
  explanation: Фильтр идёт уже по разобранным числам.
  id: python.data.data-load.t5
introduces:
