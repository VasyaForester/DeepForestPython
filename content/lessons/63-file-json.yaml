id: python.files.file-json
slug: file-json
section: files
title: JSON
order: 5
weight: 1
prerequisites:
- python.files.file-csv
goal: Превратить словарь в текст JSON и собрать словарь обратно.
tags:
- json
- словарь
theory:
- JSON — текст, которым записывают словари и списки. json.dumps принимает словарь и возвращает
  строку. json.loads принимает такую строку и возвращает словарь.
- 'Ключи в JSON всегда строки. Число остаётся числом: qty 4 после loads снова int. ensure_ascii=False
  сохраняет русские буквы как буквы, а не как последовательности \u.'
- Строку JSON можно записать в файл и прочитать тем же dumps и loads. Пока строку не пропустили
  через loads, это текст, у него нет ключей.
examples:
- title: Словарь в текст
  code: 'import json

    payload = {''name'': ''ель'', ''qty'': 4}

    text = json.dumps(payload, ensure_ascii=False)

    data = json.loads(text)

    print(data[''name''])

    print(data[''qty''])

    '
  explanation: dumps собирает строку, loads возвращает словарь. qty снова число 4.
- title: Файл
  code: "import json\npayload = {'name': 'сосна', 'qty': 1}\nwith open('stock.json', 'w',\
    \ encoding='utf-8') as handle:\n    handle.write(json.dumps(payload, ensure_ascii=False))\n\
    with open('stock.json', encoding='utf-8') as handle:\n    data = json.loads(handle.read())\n\
    print(data['qty'])\n"
  explanation: В файле лежит текст JSON. loads делает из него словарь, печатается количество
    1.
outcomes:
- собирать строку JSON через dumps
- разбирать её через loads
- сохранять русские буквы через ensure_ascii=False
- записывать JSON в файл и читать обратно
