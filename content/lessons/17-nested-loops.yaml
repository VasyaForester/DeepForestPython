id: python.conditions.nested-loops
slug: nested-loops
section: conditions
title: Вложенные циклы
order: 8
weight: 1
prerequisites:
  - python.conditions.accumulate
goal: Перебирать пары значений и понимать, сколько итераций даёт вложенность.
tags: [вложенный цикл, пары, таблица, итерации, флаг]
introduces:
  - id: nested-loop
    title: Вложенный цикл
    summary: Цикл внутри другого цикла. Внутренний проходит полностью на каждой итерации внешнего.
  - id: iterations-product
    title: Число итераций
    summary: Если внешний цикл делает n шагов, а внутренний m, тело внутреннего выполнится n умножить на m раз.
  - id: flag
    title: Флаг
    summary: Логическая переменная, которая запоминает результат проверки и читается после цикла.
theory:
  - "Внутри цикла можно написать другой цикл. Внутренний цикл проходит целиком на каждой итерации внешнего: сначала внешний делает первый шаг, внутренний отрабатывает полностью, затем внешний делает второй шаг, и всё повторяется."
  - "Поэтому число выполнений внутреннего тела перемножается. Внешний цикл на 3 шага и внутренний на 4 дадут 12 выполнений. Для больших данных это важно: вложенность быстро превращает секунды в минуты."
  - "Каждый уровень добавляет отступ. Переменные внешнего цикла доступны внутри, поэтому во внутреннем теле видны оба значения сразу — так перебирают пары."
  - "Накопитель для каждой строки создают внутри внешнего цикла, а накопитель для всей таблицы — до него. Один уровень отступа решает, что именно считает программа."
examples:
  - title: Перебор пар
    code: |
      for i in range(1, 3):
          for j in range(1, 3):
              print(f"{i} и {j}")
    explanation: Внутренний цикл проходит полностью на каждой итерации внешнего, поэтому получается четыре пары.
  - title: Сколько итераций
    code: |
      steps = 0
      for i in range(3):
          for j in range(4):
              steps = steps + 1
      print(steps)
    explanation: Три шага внешнего цикла и четыре внутреннего дают двенадцать выполнений тела.
outcomes:
  - писать цикл внутри цикла
  - считать число итераций вложенности
  - перебирать пары значений
  - запоминать результат проверки во флаге
resources:
  - kind: docs
    title: for Statements
    url: https://docs.python.org/3/tutorial/controlflow.html#for-statements
  - kind: youtube
    title: CS50P — Lecture 2
    url: https://www.youtube.com/watch?v=Kd_1Hesmdeo
    author: Harvard CS50
tasks:
  - id: python.conditions.nested-loops.t1
    type: choice
    title: Число выполнений
    difficulty: 2
    context: neutral
    prompt: Внешний цикл делает 3 итерации, внутренний — 4. Сколько раз выполнится тело внутреннего цикла?
    options:
      - id: a
        text: "7"
      - id: b
        text: "12"
      - id: c
        text: "4"
    answer: b
    hints:
      - Внутренний цикл проходит полностью на каждом шаге внешнего.
      - Значит, числа не складываются.
      - Их нужно перемножить.
    solution: b
    explanation: Тело внутреннего цикла выполняется 3 умножить на 4, то есть 12 раз.
  - id: python.conditions.nested-loops.t2
    type: predict_output
    title: Сколько строк
    difficulty: 2
    context: neutral
    prompt: Сколько строк выведет этот код?
    code: |
      for i in range(2):
          for j in range(3):
              print(f"{i}-{j}")
    options:
      - id: a
        text: "6"
      - id: b
        text: "5"
      - id: c
        text: "3"
    answer: a
    hints:
      - Внешний цикл делает два шага.
      - Внутренний на каждом шаге делает три.
      - Каждая итерация внутреннего печатает одну строку.
    solution: a
    explanation: Два шага внешнего цикла по три шага внутреннего дают шесть строк.
  - id: python.conditions.nested-loops.t3
    type: code
    title: Таблица умножения
    difficulty: 3
    context: neutral
    prompt: Прочитайте целое положительное число n. Для всех пар чисел от 1 до n выведите строки вида 1 * 2 = 2. Внешний цикл идёт по первому множителю.
    starter_code: |
      n = int(input())
    tests:
      - stdin: "2\n"
        expected_stdout: "1 * 1 = 1\n1 * 2 = 2\n2 * 1 = 2\n2 * 2 = 4\n"
      - stdin: "1\n"
        expected_stdout: "1 * 1 = 1\n"
    hints:
      - Нужны два цикла по одному и тому же диапазону.
      - Чтобы дойти до n, правой границей берут n + 1.
      - Произведение можно посчитать прямо в f-строке.
    solution: |
      n = int(input())
      for i in range(1, n + 1):
          for j in range(1, n + 1):
              print(f"{i} * {j} = {i * j}")
    explanation: Оба множителя доступны внутри вложенного цикла, поэтому строка собирается одной f-строкой.
  - id: python.conditions.nested-loops.t4
    type: code
    title: Пары с суммой, кратной трём
    difficulty: 3
    context: analytics
    prompt: Прочитайте целое положительное число n. Посчитайте, сколько пар чисел от 1 до n имеют сумму, кратную трём. Пары с разным порядком считаются разными. Выведите одно число.
    starter_code: ""
    tests:
      - stdin: "3\n"
        expected_stdout: "3\n"
      - stdin: "1\n"
        expected_stdout: "0\n"
      - stdin: "4\n"
        expected_stdout: "5\n"
    hints:
      - Счётчик создайте до обоих циклов.
      - Кратность трём проверяется остатком от деления суммы.
      - Увеличивайте счётчик внутри внутреннего цикла.
    solution: |
      n = int(input())
      count = 0
      for i in range(1, n + 1):
          for j in range(1, n + 1):
              if (i + j) % 3 == 0:
                  count = count + 1
      print(count)
    explanation: Накопитель стоит до циклов, поэтому он собирает результат по всем парам, а не по одной строке.
  - id: python.conditions.nested-loops.t5
    type: code
    title: Почините уровень накопителя
    difficulty: 4
    context: development
    prompt: Программа должна выводить сумму каждой строки таблицы умножения — по одному числу на строку. Сейчас она печатает каждое произведение отдельно. Исправьте код.
    starter_code: |
      n = int(input())
      for i in range(1, n + 1):
          for j in range(1, n + 1):
              print(i * j)
    tests:
      - stdin: "2\n"
        expected_stdout: "3\n6\n"
      - stdin: "3\n"
        expected_stdout: "6\n12\n18\n"
    hints:
      - Для каждой строки нужен свой накопитель.
      - Создавайте его внутри внешнего цикла, до внутреннего.
      - Вывод делайте после внутреннего цикла, на уровне внешнего.
    solution: |
      n = int(input())
      for i in range(1, n + 1):
          row = 0
          for j in range(1, n + 1):
              row = row + i * j
          print(row)
    explanation: Накопитель строки живёт один шаг внешнего цикла. Уровень отступа у вывода решает, печатается строка или каждое произведение.
  - id: python.conditions.nested-loops.t6
    type: code
    title: Простые числа до n
    difficulty: 4
    context: analytics
    prompt: Прочитайте целое число n не меньше 2. Выведите все простые числа от 2 до n включительно, каждое на своей строке. Простое число делится только на единицу и на себя.
    starter_code: ""
    tests:
      - stdin: "10\n"
        expected_stdout: "2\n3\n5\n7\n"
      - stdin: "2\n"
        expected_stdout: "2\n"
    hints:
      - Внешний цикл перебирает кандидатов, внутренний ищет делитель.
      - Результат проверки запомните во флаге до внутреннего цикла.
      - Найденный делитель позволяет выйти из внутреннего цикла через break.
    solution: |
      n = int(input())
      for candidate in range(2, n + 1):
          is_prime = True
          for divisor in range(2, candidate):
              if candidate % divisor == 0:
                  is_prime = False
                  break
          if is_prime:
              print(candidate)
    explanation: Флаг переносит результат внутреннего цикла наружу. Для двойки внутренний цикл не выполняется ни разу, и флаг остаётся истинным.
