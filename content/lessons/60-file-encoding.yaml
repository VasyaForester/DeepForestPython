id: python.files.file-encoding
slug: file-encoding
section: files
title: Кодировка UTF-8
order: 2
weight: 1
prerequisites:
- python.files.file-open
goal: Понять, что текстовый файл — это байты, прочитанные в выбранной кодировке.
tags:
- кодировка
- utf-8
- байты
theory:
- На диске текст хранится байтами. Кодировка — правило, по которому буквы превращаются в байты
  и собираются обратно. Одна и та же буква в разных кодировках занимает разные байты.
- open(..., encoding="utf-8") и пишет, и читает по правилам UTF-8. Если записать слово в UTF-8,
  а прочитать той же кодировкой, получится исходное слово.
- У строки «ёлка» четыре буквы, а в UTF-8 у каждой из них по два байта, всего восемь. len(word)
  считает буквы, len(word.encode("utf-8")) считает байты.
examples:
- title: Туда и обратно
  code: "word = 'ёлка'\nwith open('word.txt', 'w', encoding='utf-8') as handle:\n    handle.write(word)\n\
    with open('word.txt', encoding='utf-8') as handle:\n    print(handle.read())\n"
  explanation: Слово записано байтами UTF-8 и прочитано тем же правилом, поэтому на экране
    снова ёлка.
- title: Буквы и байты
  code: 'word = ''ёлка''

    print(len(word))

    print(len(word.encode(''utf-8'')))

    print(word.encode(''utf-8'').decode(''utf-8''))

    '
  explanation: Четыре буквы занимают восемь байт. decode возвращает ту же строку ёлка.
outcomes:
- объяснять, что текст в файле хранится байтами
- открывать файл с encoding utf-8
- записывать и читать русское слово без потерь
- отличать число букв от числа байт
resources:
- kind: docs
  title: Reading and Writing Files
  url: https://docs.python.org/3/tutorial/inputoutput.html#reading-and-writing-files
