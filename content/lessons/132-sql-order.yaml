id: python.sql.sql-order
slug: sql-order
section: sql
title: ORDER BY
order: 2
weight: 1
prerequisites:
- python.sql.sql-select
goal: Печатать строки в заданном порядке, а не в порядке вставки.
tags:
- ORDER BY
- ASC
- DESC
theory:
- Запрос SELECT name FROM trees ORDER BY height DESC начинает с самого высокого дерева. ASC
  идёт от меньшего к большему. ORDER BY name сортирует имена по алфавиту, и этот порядок не
  обязан совпадать с порядком высот.
- 'Направление нельзя подставлять из строки как попало: в коде два готовых запроса, а ввод
  только выбирает, какой выполнить. Так текст SQL остаётся под контролем.'
- LIMIT 2 после ORDER BY height DESC оставляет две верхние строки уже отсортированного результата.
examples:
- title: Сначала высокие
  code: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table trees(name\
    \ text, height int)')\ncon.executemany('insert into trees values (?, ?)', [('ель', 12),\
    \ ('сосна', 20), ('берёза', 30)])\nfor row in con.execute('select name from trees order\
    \ by height desc'):\n    print(row[0])\n"
  explanation: DESC ставит берёзу 30 первой, затем сосну и ель.
- title: По имени
  code: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table trees(name\
    \ text, height int)')\ncon.executemany('insert into trees values (?, ?)', [('ель', 12),\
    \ ('сосна', 20), ('берёза', 30)])\nfor row in con.execute('select name from trees order\
    \ by name'):\n    print(row[0])\n"
  explanation: Алфавит даёт берёзу, ель, сосну — не тот порядок, что у высот.
outcomes:
- сортировать ORDER BY по возрастанию и убыванию
- не склеивать направление из пользовательского текста
- отличать порядок имён от порядка высот
- брать верхние строки через LIMIT
