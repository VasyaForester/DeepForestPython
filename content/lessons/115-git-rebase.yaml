id: python.github.git-rebase
slug: git-rebase
section: github
title: rebase
order: 5
weight: 1
prerequisites:
- python.github.git-merge
goal: Переложить сообщения ветки поверх другой истории.
tags:
- rebase
- история
theory:
- 'Команда git rebase main берёт коммиты текущей ветки и заново прикладывает их поверх вершины
  main. История переписывается: у переложенных коммитов новые идентификаторы, даже если текст
  сообщения тот же.'
- Песочница не вызывает git и не показывает настоящие хеши. Перенос здесь — это список базы
  плюс сообщения, которых в базе ещё не было.
- В отличие от merge, rebase не оставляет отдельный коммит слияния. Он выстраивает одну линейную
  цепочку.
examples:
- title: Поверх базы
  code: "base = ['старт склада', 'цены поставки']\nextra = ['минус 10']\nfor message in base\
    \ + extra:\n    print(message)\n"
  explanation: Сообщения базы остаются впереди, минус 10 оказывается новым хвостом.
- title: Без повтора
  code: "base = ['старт склада', 'цены поставки']\nextra = ['цены поставки', 'минус 10']\n\
    result = list(base)\nfor message in extra:\n    if message not in result:\n        result.append(message)\n\
    print(result[-1])\n"
  explanation: цены поставки уже в базе и не дублируются, хвостом становится минус 10.
outcomes:
- перекладывать сообщения поверх другой базы
- получать одну линейную историю
- не дублировать сообщение, которое уже есть
- понимать, что rebase переписывает историю
resources:
