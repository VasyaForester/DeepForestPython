tasks:
- type: choice
  title: Что переписывается
  difficulty: 1
  context: neutral
  prompt: Что верно про команду git rebase main?
  options:
  - id: a
    text: 'Она переписывает историю: коммиты ветки получают новые идентификаторы'
  - id: b
    text: Она только печатает git log и ничего не меняет
  - id: c
    text: Она стирает remote и все ветки
  answer: a
  hints:
  - rebase проигрывает коммиты на новой базе.
  - Старые идентификаторы этих коммитов не сохраняются.
  - Удаление remote — другая операция.
  solution: a
  explanation: rebase переписывает историю ветки.
  id: python.github.git-rebase.t1
- type: predict_output
  title: Новый хвост
  difficulty: 1
  context: neutral
  prompt: Что напечатается?
  options:
  - id: a
    text: минус 10
  - id: b
    text: старт склада
  - id: c
    text: цены поставки
  answer: a
  hints:
  - Списки складывают слева направо.
  - Хвост — последний элемент extra.
  - База остаётся в начале.
  solution: a
  explanation: После переноса вершина — минус 10.
  code: 'base = [''старт склада'', ''цены поставки'']

    extra = [''минус 10'']

    result = base + extra

    print(result[-1])

    '
  id: python.github.git-rebase.t2
- type: code
  title: Переложить сообщения
  difficulty: 2
  context: development
  prompt: Прочитайте список базы и список переносимых сообщений. Выведите базу и следом все
    переносимые сообщения.
  starter_code: ''
  tests:
  - stdin: '2

      старт склада

      цены поставки

      1

      минус 10

      '
    expected_stdout: 'старт склада

      цены поставки

      минус 10

      '
  - stdin: '1

      старт склада

      2

      минус 10

      таблицы цен

      '
    expected_stdout: 'старт склада

      минус 10

      таблицы цен

      '
  hints:
  - Сначала прочитайте оба списка.
  - Порядок базы не меняйте.
  - Переносимые сообщения печатайте после неё.
  solution: "def read_commits():\n    count = int(input())\n    return [input().strip() for\
    \ _ in range(count)]\nbase = read_commits()\nextra = read_commits()\nfor message in base\
    \ + extra:\n    print(message)\n"
  explanation: Линейная история — база, а за ней переложенные сообщения.
  id: python.github.git-rebase.t3
- type: code
  title: Новая вершина
  difficulty: 2
  context: development
  prompt: Прочитайте базу и переносимые сообщения. Выведите только новую вершину — последнее
    сообщение результата.
  starter_code: ''
  tests:
  - stdin: '2

      старт склада

      цены поставки

      1

      минус 10

      '
    expected_stdout: 'минус 10

      '
  - stdin: '1

      старт склада

      2

      минус 10

      таблицы цен

      '
    expected_stdout: 'таблицы цен

      '
  hints:
  - Сложите два списка.
  - Вершина — последний элемент.
  - Остальное можно не печатать.
  solution: "def read_commits():\n    count = int(input())\n    return [input().strip() for\
    \ _ in range(count)]\nresult = read_commits() + read_commits()\nprint(result[-1])\n"
  explanation: Хвост переноса становится новой вершиной.
  id: python.github.git-rebase.t4
- type: code
  title: Без уже лежащих
  difficulty: 2
  context: development
  prompt: Прочитайте базу и переносимые сообщения. Сообщение, которое уже есть в базе, не
    копируйте. Выведите результат.
  starter_code: ''
  tests:
  - stdin: '2

      старт склада

      цены поставки

      2

      цены поставки

      минус 10

      '
    expected_stdout: 'старт склада

      цены поставки

      минус 10

      '
  - stdin: '1

      старт склада

      1

      старт склада

      '
    expected_stdout: 'старт склада

      '
  hints:
  - Начните с копии базы.
  - Проверяйте вхождение перед append.
  - Если добавлять нечего, напечатайте только базу.
  solution: "def read_commits():\n    count = int(input())\n    return [input().strip() for\
    \ _ in range(count)]\nresult = read_commits()\nfor message in read_commits():\n    if\
    \ message not in result:\n        result.append(message)\nfor message in result:\n   \
    \ print(message)\n"
  explanation: Уже приложенное сообщение не появляется в истории второй раз.
  id: python.github.git-rebase.t5
