id: python.algorithms.algo-recursion
slug: algo-recursion
section: algorithms
title: Рекурсия
order: 9
weight: 1
prerequisites:
- python.algorithms.algo-sort
goal: Посчитать факториал и сумму цен вызовом функции самой себя.
tags:
- рекурсия
theory:
- Рекурсия вызывает ту же функцию на более коротких данных. Для факториала fact(n) равен n
  умножить на fact(n - 1). Для суммы списка берут первый элемент и прибавляют сумму хвоста.
- Без базового случая вызовы не кончаются. Для факториала fact(0) возвращает 1. Для суммы
  пустой список даёт 0, и дальше раскручивать нечего.
- fact(4) по дороге назад умножает 4, 3, 2 и 1 и получает 24. Глубина равна числу шагов до
  базы. На нескольких ценах рекурсивная сумма совпадает с результатом обычного цикла.
examples:
- title: Факториал четырёх
  code: "def fact(n):\n    if n == 0:\n        return 1\n    return n * fact(n - 1)\nprint(fact(4))\n"
  explanation: База возвращает 1, дальше 4 умножается на 3, 2 и 1.
- title: Сумма хвостом
  code: "def total(prices):\n    if prices == []:\n        return 0\n    return prices[0]\
    \ + total(prices[1:])\nprint(total([10, 20, 5]))\n"
  explanation: 10 плюс сумма [20, 5] даёт 35, пустой хвост останавливает вызовы.
outcomes:
- вызывать функцию из неё самой
- ставить базовый случай
- считать факториал рекурсией
- считать сумму списка через голову и хвост
