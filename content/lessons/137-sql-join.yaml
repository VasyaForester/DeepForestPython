id: python.sql.sql-join
slug: sql-join
section: sql
title: JOIN
order: 7
weight: 1
prerequisites:
- python.sql.sql-sub
goal: Соединить дерево и его заметку по общему идентификатору.
tags:
- JOIN
- LEFT JOIN
- 'ON'
theory:
- JOIN склеивает строки двух таблиц по условию. SELECT species.name, notes.note FROM species
  JOIN notes ON notes.species_id = species.id возвращает только деревья, у которых заметка
  есть.
- LEFT JOIN оставляет и деревья без заметки. Пустую заметку здесь заменяют через COALESCE
  на слово нет. В данных у ели полив, у сосны замер, у берёзы заметки нет.
- Связь идёт по числу species_id, а не по совпадению текста имени. Печатают имя и заметку
  через пробел, порядок имён задаёт ORDER BY.
examples:
- title: Заметка ели
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table species(id integer, name text)'')

    con.execute(''create table notes(species_id integer, note text)'')

    con.executemany(''insert into species values (?, ?)'', [(1, ''ель''), (2, ''сосна''),
    (3, ''берёза'')])

    con.executemany(''insert into notes values (?, ?)'', [(1, ''полив''), (2, ''замер'')])

    row = con.execute(''select notes.note from species join notes on notes.species_id = species.id
    where species.name = ?'', (''ель'',)).fetchone()

    print(row[0])

    '
  explanation: Условие ON находит заметку с species_id 1, это полив.
- title: Только пары
  code: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table species(id\
    \ integer, name text)')\ncon.execute('create table notes(species_id integer, note text)')\n\
    con.executemany('insert into species values (?, ?)', [(1, 'ель'), (2, 'сосна')])\ncon.execute(\"\
    insert into notes values (1, 'полив')\")\nfor row in con.execute('select species.name\
    \ from species join notes on notes.species_id = species.id order by species.name'):\n\
    \    print(row[0])\n"
  explanation: 'Внутренний JOIN не выводит сосну: для неё нет строки в notes.'
outcomes:
- соединять таблицы по идентификатору
- отличать JOIN от LEFT JOIN
- заменять пустую заметку на нет
- считать заметки дерева, включая нуль
