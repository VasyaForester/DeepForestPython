id: python.data.data-clean
slug: data-clean
section: data
title: Даты, строки, дубликаты, выбросы
order: 16
weight: 1
prerequisites:
- python.data.data-pivot
goal: Почистить края строк, повторы, невозможные числа и прочитать дату.
tags:
- очистка
- даты
- дубликаты
theory:
- 'Перед расчётом текст обрезают: strip снимает пробелы по краям. Повтор имени ловят множеством.
  Выброс — значение за заранее названным порогом, его не смешивают с обычным максимумом, пока
  порог не задан.'
- Дату в ISO, например 2024-03-01, разбирает datetime.date.fromisoformat. В таком виде строки
  дат ещё и сравниваются по порядку календаря.
- 'Эти шаги делают и в pandas: str.strip, drop_duplicates, отбор по порогу и to_datetime.
  Упражнение считает то же списками и модулем datetime, потому что pandas нет в среде браузера.'
examples:
- title: Обрезка и повторы
  code: "names = [\" ель\", \"ель\", \"сосна \"]\nseen = set()\nclean = []\nfor name in names:\n\
    \    item = name.strip()\n    if item not in seen:\n        seen.add(item)\n        clean.append(item)\n\
    print(len(clean))\nprint(clean[0])\n"
  explanation: Пробелы сняты, повтор ели схлопнут. Остались ель и сосна.
- title: Год посадки
  code: 'from datetime import date

    day = date.fromisoformat("2024-03-01")

    print(day.year)

    print(day.month)

    '
  explanation: Дата разбирается на год 2024 и месяц 3.
outcomes:
- обрезать пробелы у строк
- убирать повторы множеством
- отсекать значения выше заданного порога
- разбирать дату ISO модулем datetime
