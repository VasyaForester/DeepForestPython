id: python.viz.viz-box
slug: viz-box
section: viz
title: Коробка с усами
order: 6
weight: 1
prerequisites:
- python.viz.viz-hist
goal: Печатать минимум, медиану и максимум ряда нечётной длины.
tags:
- ящик с усами
theory:
- Ящик с усами, plt.boxplot, показывает середину ряда и края. Линия внутри ящика — медиана.
  Сам ящик строится по квартилям, усы тянутся к краям, если их не отсекли как выбросы.
- Медиана делит упорядоченный ряд пополам. При нечётном числе значений это средний элемент,
  а не среднее арифметическое. Ряд 3, 7, 9, 12, 15 имеет медиану 9.
- Упражнение печатает минимум, медиану и максимум, потому что matplotlib нет в среде браузера.
  Квартили здесь не подменяются другими формулами.
examples:
- title: Пять высот
  code: 'heights = [9, 3, 12, 7, 15]

    ordered = sorted(heights)

    print(ordered[0])

    print(ordered[len(ordered) // 2])

    print(ordered[-1])

    '
  explanation: Упорядоченный ряд 3, 7, 9, 12, 15. Медиана — 9.
- title: Три цены
  code: 'prices = [40, 10, 20]

    ordered = sorted(prices)

    print(ordered[1])

    '
  explanation: Середина упорядоченных цен 10, 20, 40 — это 20.
outcomes:
- отличать медиану от среднего
- брать медиану из середины нечётного ряда
- читать линию внутри ящика
- печатать минимум и максимум как края
