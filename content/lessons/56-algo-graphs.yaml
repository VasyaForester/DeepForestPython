id: python.algorithms.algo-graphs
slug: algo-graphs
section: algorithms
title: Графы
order: 13
weight: 1
prerequisites:
- python.algorithms.algo-dfs
goal: Превратить список дорог в словарь соседей и посчитать их.
tags:
- граф
theory:
- 'Граф состоит из вершин и рёбер. Список рёбер хранит пары вроде склада с лесом и леса с
  елью. Для обхода удобнее словарь: у каждой вершины свой список соседей.'
- Ненаправленное ребро добавляют с обеих сторон. Пустой список создают до первой вставки,
  иначе ключа ещё нет. После сборки число соседей — это длина списка у выбранного имени.
- В простом журнале дорог каждое ребро приходит один раз. Повтор той же пары добавил бы соседа
  дважды, и длина выросла бы зря. Печатают длину списка соседей, это и есть ответ.
examples:
- title: Две дороги
  code: "edges = [('склад', 'лес'), ('лес', 'ель')]\ngraph = {}\nfor a, b in edges:\n    if\
    \ a not in graph:\n        graph[a] = []\n    if b not in graph:\n        graph[b] = []\n\
    \    graph[a].append(b)\n    graph[b].append(a)\nprint(len(graph['лес']))\n"
  explanation: 'У леса два соседа: склад и ель.'
- title: Одна дорога
  code: "edges = [('склад', 'лес')]\ngraph = {}\nfor a, b in edges:\n    if a not in graph:\n\
    \        graph[a] = []\n    if b not in graph:\n        graph[b] = []\n    graph[a].append(b)\n\
    \    graph[b].append(a)\nprint(len(graph['склад']))\n"
  explanation: У склада один сосед, длина списка равна 1.
outcomes:
- переводить список рёбер в словарь
- добавлять ненаправленное ребро с обеих сторон
- создавать пустой список до первой вставки
- считать соседей длиной списка
