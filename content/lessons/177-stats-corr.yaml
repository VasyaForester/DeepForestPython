id: python.stats.stats-corr
slug: stats-corr
section: stats
title: Корреляция
order: 6
weight: 1
prerequisites:
- python.stats.stats-ci
goal: Определять знак совместного хода двух рядов одним словом.
tags:
- корреляция
theory:
- 'Корреляция говорит, ходят ли два ряда вместе. Положительный знак: большие с большими. Отрицательный:
  большие с меньшими. Ноль этой суммы: линейного совместного хода не видно.'
- Знак совпадает со знаком суммы (x - среднее x) * (y - среднее y). Её можно посчитать целым
  выражением n * сумма произведений - сумма x * сумма y и не печатать длинный коэффициент.
- Коэффициент Пирсона ещё делит эту сумму на разбросы. На знак при ненулевых разбросах деление
  не влияет. Модуль statistics не используется.
examples:
- title: Вместе растут
  code: 'xs = [1, 2, 3]

    ys = [2, 4, 6]

    n = len(xs)

    score = n * sum(x * y for x, y in zip(xs, ys)) - sum(xs) * sum(ys)

    print("положительная" if score > 0 else "отрицательная")

    '
  explanation: Оба ряда растут. Целая сумма положительна, слово — положительная.
- title: Встречный ход
  code: 'xs = [1, 2, 3]

    ys = [6, 4, 2]

    n = len(xs)

    score = n * sum(x * y for x, y in zip(xs, ys)) - sum(xs) * sum(ys)

    print("отрицательная" if score < 0 else "положительная")

    '
  explanation: Второй ряд падает, пока первый растёт. Знак отрицательный.
outcomes:
- определять знак совместного хода
- считать целую сумму вместо длинного коэффициента
- не принимать корреляцию за причину
- называть нулевой знак отдельно
