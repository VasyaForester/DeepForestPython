id: python.sql.sql-cte
slug: sql-cte
section: sql
title: CTE
order: 9
weight: 1
prerequisites:
- python.sql.sql-union
goal: Назвать промежуточный результат и отобрать из него строки.
tags:
- CTE
- WITH
theory:
- CTE — именованный подзапрос перед основным SELECT. WITH tall AS (SELECT name, height FROM
  trees WHERE height >= 20) SELECT name FROM tall берёт только высокие деревья и уже из них
  печатает имена.
- 'Второй шаг может группировать: WITH sums AS (SELECT city, SUM(amount) AS total FROM orders
  GROUP BY city) SELECT city FROM sums WHERE total >= 20. Основной запрос видит столбец total,
  а не сырые заказы.'
- 'Две CTE можно записать через запятую. Порог по-прежнему передают знаком ?, данные те же:
  ель 12, сосна 20, берёза 30 и заказы Москвы и Казани.'
examples:
- title: Высокие через WITH
  code: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table trees(name\
    \ text, height int)')\ncon.executemany('insert into trees values (?, ?)', [('ель', 12),\
    \ ('сосна', 20), ('берёза', 30)])\nfor row in con.execute('with tall as (select name from\
    \ trees where height >= 20) select name from tall order by name'):\n    print(row[0])\n"
  explanation: CTE tall прячет фильтр, внешний запрос только печатает берёзу и сосну.
- title: Суммы городов
  code: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table orders(city\
    \ text, amount int)')\ncon.executemany('insert into orders values (?, ?)', [('Москва',\
    \ 10), ('Москва', 15), ('Казань', 16)])\nfor row in con.execute('with sums as (select\
    \ city, sum(amount) as total from orders group by city) select city from sums where total\
    \ >= 20 order by city'):\n    print(row[0])\n"
  explanation: В sums у Москвы 25, порог 20 оставляет её одну.
outcomes:
- называть промежуточную выборку через WITH
- фильтровать уже посчитанные суммы
- связывать две CTE
- оставлять основной SELECT коротким
