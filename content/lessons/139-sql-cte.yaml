  hints:
  - 12 не проходит порог.
  - 20 и 30 проходят.
  - Длина списка — число строк CTE.
  solution: a
  explanation: В tall попадают сосна и берёза.
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.executemany(''insert into trees values (?, ?)'', [(''ель'', 12), (''сосна'', 20),
    (''берёза'', 30)])

    rows = list(con.execute(''with tall as (select name from trees where height >= 20) select
    name from tall''))

    print(len(rows))

    '
  id: python.sql.sql-cte.t2
- type: code
  title: Имена выше порога
  difficulty: 2
  context: development
  prompt: Прочитайте порог. Через CTE выведите имена с высотой не меньше порога, по алфавиту.
  starter_code: ''
  tests:
  - stdin: '20

      '
    expected_stdout: 'берёза

      сосна

      '
  - stdin: '30

      '
    expected_stdout: 'берёза

      '
  hints:
  - WITH стоит перед основным SELECT.
  - Знак ? лежит внутри CTE.
  - Снаружи сортируйте по имени.
  solution: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table\
    \ trees(name text, height int)')\ncon.executemany('insert into trees values (?, ?)', [('ель',\
    \ 12), ('сосна', 20), ('берёза', 30)])\nlimit = int(input())\nquery = 'with tall as (select\
    \ name from trees where height >= ?) select name from tall order by name'\nfor row in\
    \ con.execute(query, (limit,)):\n    print(row[0])\n"
  explanation: Основной запрос не повторяет условие, он читает уже отфильтрованное имя tall.
  id: python.sql.sql-cte.t3
- type: code
  title: Города с суммой
  difficulty: 2
  context: development
  prompt: Заказы Москвы 10 и 15, Казани 7, 8 и 1. Прочитайте порог суммы и через CTE выведите
    города, по алфавиту.
  starter_code: ''
  tests:
  - stdin: '20

      '
    expected_stdout: 'Москва

      '
  - stdin: '10

      '
    expected_stdout: 'Казань

      Москва

      '
  hints:
  - В CTE посчитайте SUM и назовите столбец total.
  - Порог сравнивайте уже с total.
  - ORDER BY стоит во внешнем запросе.
  solution: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table\
    \ orders(city text, amount int)')\ncon.executemany('insert into orders values (?, ?)',\
    \ [('Москва', 10), ('Москва', 15), ('Казань', 7), ('Казань', 8), ('Казань', 1)])\nlimit\
    \ = int(input())\nquery = 'with sums as (select city, sum(amount) as total from orders\
    \ group by city) select city from sums where total >= ? order by city'\nfor row in con.execute(query,\
    \ (limit,)):\n    print(row[0])\n"
  explanation: Группировка спрятана в CTE, фильтр суммы остаётся снаружи.
  id: python.sql.sql-cte.t4
- type: code
  title: Два шага
  difficulty: 2
  context: development
  prompt: Прочитайте порог и выведите, сколько деревьев его проходит. Сначала CTE base со
    всеми строками, затем tall из base.
  starter_code: ''
  tests:
  - stdin: '20

      '
    expected_stdout: '2

      '
  - stdin: '0

      '
    expected_stdout: '3

      '
  hints:
  - Две CTE разделяет запятая.
  - Вторая читает первую.
  - Снаружи остаётся COUNT.
  solution: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.executemany(''insert into trees values (?, ?)'', [(''ель'', 12), (''сосна'', 20),
    (''берёза'', 30)])

    limit = int(input())

    query = ''with base as (select name, height from trees), tall as (select name from base
    where height >= ?) select count(*) from tall''

    row = con.execute(query, (limit,)).fetchone()

    print(row[0])

    '
  explanation: Цепочка CTE дробит запрос на понятные шаги.
  id: python.sql.sql-cte.t5
