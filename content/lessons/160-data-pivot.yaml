  options:
  - id: a
    text: '1'
  - id: b
    text: '2'
  - id: c
    text: '3'
  answer: b
  hints:
  - Нужны оба условия сразу.
  - Южная сосна не входит.
  - Северных елей две.
  solution: b
  explanation: В клетке север-ель стоит 2.
  code: 'rows = [("север", "ель"), ("север", "ель"), ("юг", "сосна")]

    print(sum(1 for park, kind in rows if park == "север" and kind == "ель"))

    '
  id: python.data.data-pivot.t2
- type: code
  title: Клетка сводки
  difficulty: 2
  context: development
  prompt: Прочитайте n, n строк парк порода и ещё одну пару. Выведите, сколько раз встретилась
    эта пара.
  starter_code: ''
  tests:
  - stdin: '4

      север ель

      север ель

      юг сосна

      север сосна

      север ель

      '
    expected_stdout: '2

      '
  - stdin: '1

      юг дуб

      север дуб

      '
    expected_stdout: '0

      '
  hints:
  - Ключ — пара из двух слов.
  - Неизвестная пара даёт 0.
  - Запрос читается после всех строк.
  solution: "n = int(input())\ncounts = {}\nfor _ in range(n):\n    park, kind = input().split()\n\
    \    key = (park, kind)\n    counts[key] = counts.get(key, 0) + 1\npark, kind = input().split()\n\
    print(counts.get((park, kind), 0))\n"
  explanation: Одна клетка сводки — счёт одной пары.
  id: python.data.data-pivot.t3
- type: code
  title: Все клетки
  difficulty: 2
  context: development
  prompt: Прочитайте n и n строк парк порода. Выведите каждую встреченную пару и её счёт.
    Пары сортируйте по парку, затем по породе.
  starter_code: ''
  tests:
  - stdin: '4

      север ель

      север ель

      юг сосна

      север сосна

      '
    expected_stdout: 'север ель 2

      север сосна 1

      юг сосна 1

      '
  - stdin: '1

      юг дуб

      '
    expected_stdout: 'юг дуб 1

      '
  hints:
  - Считайте пары в словаре.
  - sorted упорядочит кортежи.
  - Печатайте три поля.
  solution: "n = int(input())\ncounts = {}\nfor _ in range(n):\n    park, kind = input().split()\n\
    \    key = (park, kind)\n    counts[key] = counts.get(key, 0) + 1\nfor park, kind in sorted(counts):\n\
    \    print(park, kind, counts[(park, kind)])\n"
  explanation: Полная сводка — список клеток, а не одна сумма.
  id: python.data.data-pivot.t4
- type: code
  title: Самая частая пара
  difficulty: 2
  context: development
  prompt: Прочитайте n и n строк парк порода. Выведите пару с наибольшим счётом и сам счёт.
    При равенстве берите пару, которая раньше по алфавиту.
  starter_code: ''
  tests:
  - stdin: '3

      север ель

      север ель

      юг сосна

      '
    expected_stdout: 'север ель 2

      '
  - stdin: '2

      юг дуб

      север дуб

      '
    expected_stdout: 'север дуб 1

      '
  hints:
  - Сначала посчитайте все пары.
  - При равенстве не заменяйте уже выбранную, если идёте по алфавиту.
  - Печатайте оба ключа и счёт.
  solution: "n = int(input())\ncounts = {}\nfor _ in range(n):\n    park, kind = input().split()\n\
    \    key = (park, kind)\n    counts[key] = counts.get(key, 0) + 1\nbest = None\nbest_count\
    \ = -1\nfor key in sorted(counts):\n    if counts[key] > best_count:\n        best = key\n\
    \        best_count = counts[key]\nprint(best[0], best[1], best_count)\n"
  explanation: Максимум ищут уже по клеткам сводки.
  id: python.data.data-pivot.t5
