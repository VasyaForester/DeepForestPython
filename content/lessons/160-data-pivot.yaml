id: python.data.data-pivot
slug: data-pivot
section: data
title: Сводка
order: 15
weight: 1
prerequisites:
- python.data.data-merge
goal: Считать сочетания двух ключей.
tags:
- pivot
theory:
- Сводная таблица раскладывает один показатель по двум ключам. pandas делает это через pivot_table,
  а число строк в клетке — через aggfunc='count'.
- 'Клетка сводки — пара вроде парк и порода. Это не фильтр одной строки и не groupby по одному
  ключу: ключей два сразу.'
- Упражнение считает пары словарём, потому что pandas нет в среде браузера. Отдельная библиотека
  сводных таблиц не нужна.
examples:
- title: Пары парк-порода
  code: "rows = [{\"парк\": \"север\", \"порода\": \"ель\"}, {\"парк\": \"север\", \"порода\"\
    : \"ель\"}, {\"парк\": \"юг\", \"порода\": \"сосна\"}]\ncounts = {}\nfor row in rows:\n\
    \    key = (row[\"парк\"], row[\"порода\"])\n    counts[key] = counts.get(key, 0) + 1\n\
    print(counts[(\"север\", \"ель\")])\nprint(counts[(\"юг\", \"сосна\")])\n"
  explanation: На севере две ели. На юге одна сосна.
- title: Нулевая клетка
  code: 'counts = {("север", "ель"): 2}

    print(counts.get(("юг", "ель"), 0))

    '
  explanation: Такой пары не было, поэтому запасное значение 0.
outcomes:
- считать сочетания двух ключей
- читать pivot_table как раскладку по двум осям
- отдавать 0 для невстреченной пары
- выбирать самую частую клетку
