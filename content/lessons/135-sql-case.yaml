id: python.sql.sql-case
slug: sql-case
section: sql
title: CASE и NULL
order: 5
weight: 1
prerequisites:
- python.sql.sql-having
goal: Отличать отсутствующую высоту через IS NULL и подписывать её в CASE.
tags:
- 'NULL'
- CASE
- IS NULL
theory:
- 'NULL означает, что значения нет. Сравнение height = NULL не находит такие строки: неизвестное
  не равно неизвестному. Нужен запрос SELECT name FROM trees WHERE height IS NULL.'
- 'CASE подставляет текст вместо пустоты: CASE WHEN height IS NULL THEN ''нет'' ELSE height
  END. В таблице ель 12, сосна 20 и липа без высоты.'
- 'Порог можно вписать в тот же CASE: от 15 и выше — высокий, известная высота ниже — низкий,
  NULL — нет.'
examples:
- title: Пустая высота
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.execute("insert into trees values (''липа'', null)")

    row = con.execute(''select name from trees where height is null'').fetchone()

    print(row[0])

    '
  explanation: IS NULL находит липу. Сравнение через знак равно эту строку бы пропустило.
- title: Подпись вместо пустоты
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.execute("insert into trees values (''липа'', null)")

    row = con.execute("select case when height is null then ''нет'' else height end from trees").fetchone()

    print(row[0])

    '
  explanation: CASE заменяет NULL на слово нет.
outcomes:
- искать пустоту через IS NULL
- не использовать сравнение = NULL
- заменять NULL в выражении CASE
- подписывать известную высоту по порогу
