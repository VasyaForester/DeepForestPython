id: python.collections.lists
slug: lists
section: collections
title: Список
order: 3
weight: 1
prerequisites:
  - python.collections.string-methods
goal: Хранить несколько значений в одном имени и обходить их циклом.
tags: [list, список, индекс, изменяемость, перебор]
introduces:
  - id: list
    title: Список
    summary: Изменяемая последовательность значений в квадратных скобках. Элементы разделяются запятыми.
  - id: list-mutate
    title: Изменение элемента
    summary: Элемент списка можно заменить присваиванием по индексу. Запись items[0] = 8 меняет первый элемент на месте.
  - id: list-iter
    title: Перебор списка
    summary: "Цикл for item in items: отдаёт элементы по очереди. Индекс считать не нужно, если он сам по себе не нужен."
theory:
  - "Список хранит несколько значений в одном имени. Их записывают в квадратных скобках через запятую: trees = [\"ель\", \"сосна\"]. Индексы и срезы работают так же, как у строки: trees[0], trees[-1], trees[1:]. Длину даёт len(trees), вхождение проверяет in."
  - "В отличие от строки, список изменяем. Присваивание trees[1] = \"пихта\" меняет второй элемент на месте. Можно хранить значения разных типов, но на практике в одном списке обычно лежат однородные данные."
  - "Перебор пишут for item in trees. Цикл сам подставляет очередной элемент, отдельно вычислять индекс не нужно. Если нужен и номер, позже появится enumerate. Пока при необходимости берут range(len(trees))."
  - "Присваивание b = a не копирует список, а даёт второе имя тому же объекту. Поэтому правка b[0] видна и через a. Чтобы получить независимую копию, берут срез a[:] или list(a)."
examples:
  - title: Индекс и замена
    code: |
      trees = ["ель", "сосна", "пихта"]
      print(trees[0])
      trees[1] = "кедр"
      print(trees)
      print(len(trees))
    explanation: Второй элемент заменён на месте. Длина осталась три, потому что элемент не добавили и не удалили.
  - title: Перебор и копия
    code: |
      values = [2, 4, 6]
      copy = values[:]
      alias = values
      alias[0] = 9
      print(values)
      print(copy)
      for item in copy:
          print(item)
    explanation: alias указывает на тот же список, поэтому values тоже стал [9, 4, 6]. Срез copy остался прежним.
outcomes:
  - создавать список и читать элемент по индексу
  - заменять элемент присваиванием
  - обходить список циклом for
  - отличать копию срезом от второго имени того же списка
resources:
  - kind: docs
    title: Lists
    url: https://docs.python.org/3/tutorial/introduction.html#lists
  - kind: youtube
    title: CS50P — Lecture 5, lists
    url: https://www.youtube.com/watch?v=0LrdjNb4lP8
    author: Harvard CS50
tasks:
  - id: python.collections.lists.t1
    type: choice
    title: Чем список отличается от строки
    difficulty: 1
    context: neutral
    prompt: Что можно сделать со списком, но нельзя со строкой?
    options:
      - id: a
        text: Узнать длину через len
      - id: b
        text: Взять элемент по индексу 0
      - id: c
        text: Заменить элемент присваиванием по индексу
    answer: c
    hints:
      - len и индекс работают у обеих последовательностей.
      - Строка неизменяема.
      - Список можно править на месте.
    solution: c
    explanation: Индексация и длина общие. Присваивание по индексу есть только у изменяемых последовательностей.
  - id: python.collections.lists.t2
    type: predict_output
    title: Два имени
    difficulty: 2
    context: development
    prompt: Что выведет программа?
    code: |
      a = [1, 2]
      b = a
      b[0] = 8
      print(a)
    options:
      - id: a
        text: "[1, 2]"
      - id: b
        text: "[8, 2]"
      - id: c
        text: "[8]"
    answer: b
    hints:
      - b = a не создаёт новый список.
      - Правка через одно имя видна через другое.
      - Длина не изменилась.
    solution: b
    explanation: Оба имени указывают на один список, поэтому a печатается как [8, 2].
  - id: python.collections.lists.t3
    type: predict_output
    title: Печать элементов
    difficulty: 1
    context: analytics
    prompt: Что будет выведено последним?
    code: |
      temps = [12, 7, 15]
      for value in temps:
          print(value)
    options:
      - id: a
        text: "15"
      - id: b
        text: "[12, 7, 15]"
      - id: c
        text: "2"
    answer: a
    hints:
      - Цикл печатает элементы по одному, не весь список сразу.
      - Последний элемент — 15.
      - Индексы сами по себе не печатаются.
    solution: a
    explanation: Три вызова print дают 12, 7 и 15. Последняя строка — 15.
  - id: python.collections.lists.t4
    type: code
    title: Замена первого
    difficulty: 2
    context: development
    prompt: Прочитайте три строки в список. Замените первый элемент на слово старт и выведите элементы списка по одному в строке.
    starter_code: |
      items = [input(), input(), input()]
    tests:
      - stdin: "а\nб\nв\n"
        expected_stdout: "старт\nб\nв\n"
      - stdin: "1\n2\n3\n"
        expected_stdout: "старт\n2\n3\n"
    hints:
      - Первый элемент меняют присваиванием items[0].
      - Дальше нужен цикл по списку.
      - Печатайте элемент, а не весь список сразу.
    solution: |
      items = [input(), input(), input()]
      items[0] = "старт"
      for item in items:
          print(item)
    explanation: Три значения собраны в список, нулевой заменён, цикл печатает актуальные элементы.
  - id: python.collections.lists.t5
    type: code
    title: Есть ли нуль
    difficulty: 2
    context: analytics
    prompt: Первая строка — число n, далее n целых чисел. Выведите yes, если среди них есть 0, иначе no.
    starter_code: |
      n = int(input())
    tests:
      - stdin: "4\n3\n0\n8\n1\n"
        expected_stdout: "yes\n"
      - stdin: "3\n4\n5\n6\n"
        expected_stdout: "no\n"
    hints:
      - Можно собрать числа в список и проверить in, а можно поставить флаг.
      - Сравнивайте с числом 0, не со строкой.
      - Флаг начинается с False и становится True при первом нуле.
    solution: |
      n = int(input())
      found = False
      for _ in range(n):
          value = int(input())
          if value == 0:
              found = True
      if found:
          print("yes")
      else:
          print("no")
    explanation: Нуль ищут за один проход. Флаг из прошлого раздела справляется без новых методов списка.
  - id: python.collections.lists.t6
    type: code
    title: Независимая копия
    difficulty: 3
    context: development
    prompt: "Прочитайте два целых числа a и b. Создайте список [a, b], сделайте его копию срезом, в копии замените первый элемент на 0 и выведите сначала исходный список, затем копию."
    starter_code: |
      a = int(input())
      b = int(input())
    tests:
      - stdin: "4\n9\n"
        expected_stdout: "[4, 9]\n[0, 9]\n"
      - stdin: "1\n1\n"
        expected_stdout: "[1, 1]\n[0, 1]\n"
    hints:
      - Копию даёт срез [:] или вызов list.
      - Если написать copy = data, исходный список тоже изменится.
      - print списка показывает квадратные скобки сам.
    solution: |
      a = int(input())
      b = int(input())
      data = [a, b]
      copy = data[:]
      copy[0] = 0
      print(data)
      print(copy)
    explanation: Срез создаёт новый список. Правка копии не трогает исходные значения.
