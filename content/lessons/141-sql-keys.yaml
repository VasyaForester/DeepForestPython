id: python.sql.sql-keys
slug: sql-keys
section: sql
title: Индексы и ключи
order: 11
weight: 1
prerequisites:
- python.sql.sql-window
goal: Найти строку по первичному ключу и не вставить дубликат.
tags:
- PRIMARY KEY
- FOREIGN KEY
- sqlite_master
theory:
- 'PRIMARY KEY делает значение уникальным и удобным для поиска: SELECT name FROM species WHERE
  id = 1 возвращает одну ель. Повторная вставка того же id не проходит.'
- 'FOREIGN KEY связывает заметку с деревом: species_id ссылается на species(id). В SQLite
  проверка включается командой PRAGMA foreign_keys = ON, иначе ссылка может не контролироваться.'
- Имена созданных таблиц лежат в sqlite_master. Задачи ниже либо ищут строку по ключу, либо
  сообщают отказ на повтор, либо проверяют, есть ли таблица в sqlite_master.
examples:
- title: Чужая ссылка
  code: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('pragma foreign_keys\
    \ = on')\ncon.execute('create table species(id integer primary key, name text)')\ncon.execute('create\
    \ table notes(id integer primary key, species_id integer references species(id), note\
    \ text)')\ncon.execute(\"insert into species values (1, 'ель')\")\ntry:\n    con.execute(\"\
    insert into notes values (1, 9, 'полив')\")\n    print('записано')\nexcept sqlite3.IntegrityError:\n\
    \    print('отказ')\n"
  explanation: При включённых внешних ключах ссылка на несуществующий id 9 получает отказ.
- title: Поиск по ключу
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table species(id integer primary key, name text)'')

    con.execute("insert into species values (1, ''ель'')")

    row = con.execute(''select name from species where id = 1'').fetchone()

    print(row[0])

    '
  explanation: Первичный ключ 1 сразу указывает на строку ели.
outcomes:
- объявлять PRIMARY KEY
- искать строку по ключу
- получать отказ на повтор ключа
- проверять имя таблицы в sqlite_master
resources:
