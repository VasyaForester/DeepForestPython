id: python.capstone.cap-store
slug: cap-store
section: capstone
title: Хранение
order: 5
weight: 1
prerequisites:
- python.capstone.cap-rules
goal: Записать строки журнала в sqlite3 и напечатать их число.
tags:
- sqlite3
- таблица
- журнал
theory:
- Разобранные записи можно положить в таблицу sqlite3 в памяти. Файл базы не создаётся.
- Таблица journal хранит имя и целое значение. Вставка передаёт их через ?, без склейки текста
  запроса.
- После всех вставок программа печатает count. Это число строк в таблице, а не сумма значений.
examples:
- title: Две вставки
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table journal(name text, value integer)'')

    con.execute(''insert into journal(name, value) values (?, ?)'', (''ель'', 2))

    con.execute(''insert into journal(name, value) values (?, ?)'', (''сосна'', 3))

    print(con.execute(''select count(*) from journal'').fetchone()[0])

    '
  explanation: В таблице две строки, count печатает 2.
- title: Одна строка
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table journal(name text, value integer)'')

    con.execute(''insert into journal(name, value) values (?, ?)'', (''пихта'', 4))

    print(con.execute(''select count(*) from journal'').fetchone()[0])

    '
  explanation: Одна вставка даёт count 1.
outcomes:
- создавать таблицу journal в памяти
- вставлять имя и значение через ?
- не склеивать текст запроса
- печатать число строк
