id: python.data.data-frame
slug: data-frame
section: data
title: Таблица записей
order: 7
weight: 1
prerequisites:
- python.data.data-vector
goal: Хранить таблицу списком словарей и доставать столбец по имени.
tags:
- dataframe
- series
theory:
- DataFrame в pandas — таблица с именами столбцов. Одна строка — запись, один столбец — Series.
- 'Список словарей с одинаковыми ключами передаёт ту же идею: ключ — имя столбца, список —
  набор строк. Series здесь — список значений одного ключа.'
- Упражнение считает то же самое списками словарей, потому что pandas нет в среде браузера.
examples:
- title: Две записи
  code: 'rows = [{"порода": "ель", "высота": 12}, {"порода": "сосна", "высота": 9}]

    print(rows[0]["порода"])

    print(rows[1]["высота"])

    '
  explanation: Первая запись даёт породу, вторая — высоту своего столбца.
- title: Столбец цен
  code: 'rows = [{"товар": "ель", "цена": 400}, {"товар": "сосна", "цена": 250}, {"товар":
    "берёза", "цена": 180}]

    series = [row["цена"] for row in rows]

    print(len(series))

    print(series[2])

    '
  explanation: Столбец цена ведёт себя как Series из трёх чисел. Последнее — 180.
outcomes:
- представлять строку словарём
- собирать столбец по ключу
- называть таблицу DataFrame, а столбец Series
- выбирать запись по позиции и поле по имени
