id: python.algorithms.algo-binary
slug: algo-binary
section: algorithms
title: Бинарный поиск
order: 7
weight: 1
prerequisites:
- python.algorithms.algo-linear
goal: Искать цену в уже отсортированном списке, отбрасывая половину.
tags:
- бинарный поиск
theory:
- Бинарный поиск требует список, упорядоченный по возрастанию. Смотрят на средний элемент.
  Если он больше искомого, правая часть уже не нужна, если меньше — отбрасывают левую.
- Левую и правую границы держат индексами. Пока левая граница не больше правой, середина равна
  целому от деления суммы границ на 2. Совпадение возвращает индекс, пустой промежуток даёт
  -1.
- 'Каждый шаг режет диапазон примерно пополам, поэтому шагов около логарифма длины. На ценах
  в произвольном порядке метод непригоден: сравнение с серединой тогда ничего не гарантирует.
  Перед поиском ряд уже должен расти от меньшего к большему.'
examples:
- title: Индекс 12
  code: "def binary(items, target):\n    left = 0\n    right = len(items) - 1\n    while left\
    \ <= right:\n        mid = (left + right) // 2\n        if items[mid] == target:\n   \
    \         return mid\n        if items[mid] < target:\n            left = mid + 1\n  \
    \      else:\n            right = mid - 1\n    return -1\nprint(binary([3, 8, 12, 20],\
    \ 12))\n"
  explanation: Середины сужают диапазон, 12 находится на индексе 2.
- title: Пятёрки нет
  code: "def binary(items, target):\n    left = 0\n    right = len(items) - 1\n    while left\
    \ <= right:\n        mid = (left + right) // 2\n        if items[mid] == target:\n   \
    \         return mid\n        if items[mid] < target:\n            left = mid + 1\n  \
    \      else:\n            right = mid - 1\n    return -1\nprint(binary([3, 8, 12, 20],\
    \ 5))\n"
  explanation: Пятёрка не встречается, границы расходятся, ответ -1.
outcomes:
- искать только в упорядоченном списке
- сужать границы по средней цене
- возвращать индекс или -1
- видеть, что шагов около логарифма длины
