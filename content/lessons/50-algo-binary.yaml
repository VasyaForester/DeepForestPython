tasks:
- type: choice
  title: Когда метод годится
  difficulty: 1
  context: neutral
  prompt: Когда бинарный поиск даёт верный индекс?
  options:
  - id: a
    text: Когда список заранее упорядочен по возрастанию
  - id: b
    text: Когда все цены равны нулю и список пуст по смыслу задачи
  - id: c
    text: Когда цены лежат в произвольном порядке
  answer: a
  hints:
  - Середина должна делить меньшие и большие.
  - Без порядка отброшенная половина может скрывать ответ.
  - Пустой список — частный случай, не условие метода.
  solution: a
  explanation: Метод опирается на то, что слева числа не больше середины, а справа не меньше.
  id: python.algorithms.algo-binary.t1
