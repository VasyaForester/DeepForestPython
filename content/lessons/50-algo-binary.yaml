    text: '12'
  answer: a
  hints:
  - Список уже отсортирован.
  - 12 — третий элемент.
  - Индекс третьего элемента равен 2.
  solution: a
  explanation: Число 12 стоит на индексе 2.
  code: "def binary(items, target):\n    left = 0\n    right = len(items) - 1\n    while left\
    \ <= right:\n        mid = (left + right) // 2\n        if items[mid] == target:\n   \
    \         return mid\n        if items[mid] < target:\n            left = mid + 1\n  \
    \      else:\n            right = mid - 1\n    return -1\nprint(binary([3, 8, 12, 20],\
