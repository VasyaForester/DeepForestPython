- type: code
  title: Индекс в упорядоченном ряду
  difficulty: 2
  context: development
  prompt: Прочитайте n, затем n целых уже по возрастанию, затем искомое число. Выведите его
    индекс или -1.
  starter_code: ''
  tests:
  - stdin: '4

      3

      8

      12

      20

      12

      '
    expected_stdout: '2

      '
  - stdin: '3

      1

      2

      4

      3

      '
    expected_stdout: '-1

      '
  hints:
  - Границы включительны, пока left не больше right.
  - Середину берите целым делением.
  - Ненайденное число даёт -1.
  solution: "def binary(items, target):\n    left = 0\n    right = len(items) - 1\n    while\
    \ left <= right:\n        mid = (left + right) // 2\n        if items[mid] == target:\n\
    \            return mid\n        if items[mid] < target:\n            left = mid + 1\n\
    \        else:\n            right = mid - 1\n    return -1\nn = int(input())\nitems =\
    \ []\nfor _ in range(n):\n    items.append(int(input()))\ntarget = int(input())\nprint(binary(items,\
    \ target))\n"
  explanation: Поиск сужает границы, пока не найдёт индекс или не исчерпает диапазон.
  id: python.algorithms.algo-binary.t3
- type: code
  title: Само число или промах
  difficulty: 2
  context: development
  prompt: Прочитайте n, затем n целых по возрастанию, затем искомое. Если индекс найден, выведите
    само число из списка, иначе -1.
  starter_code: ''
  tests:
  - stdin: '4

      3

      8

      12

      20

      8

      '
    expected_stdout: '8

      '
  - stdin: '2

      1

      4

      9

      '
    expected_stdout: '-1

      '
  hints:
  - Сначала получите индекс.
  - При -1 печатайте -1.
  - Иначе печатайте элемент по индексу.
  solution: "def binary(items, target):\n    left = 0\n    right = len(items) - 1\n    while\
    \ left <= right:\n        mid = (left + right) // 2\n        if items[mid] == target:\n\
    \            return mid\n        if items[mid] < target:\n            left = mid + 1\n\
    \        else:\n            right = mid - 1\n    return -1\nn = int(input())\nitems =\
    \ []\nfor _ in range(n):\n    items.append(int(input()))\ntarget = int(input())\nindex\
    \ = binary(items, target)\nif index == -1:\n    print(-1)\nelse:\n    print(items[index])\n"
  explanation: Найденный индекс превращают обратно в цену из того же списка.
  id: python.algorithms.algo-binary.t4
- type: code
  title: Сколько шагов поиска
  difficulty: 2
  context: development
  prompt: Прочитайте n, затем n целых по возрастанию, затем искомое. Выведите, сколько раз
    цикл вычислил середину, пока не нашёл число или не закончился.
  starter_code: ''
  tests:
  - stdin: '1

      5

      5

      '
    expected_stdout: '1

      '
  - stdin: '4

      3

      8

      12

      20

      20

      '
    expected_stdout: '3

      '
  hints:
  - Счётчик увеличивайте в начале тела цикла.
  - На совпадении верните его сразу.
  - Если число не нашли, верните, сколько середин успели посмотреть.
  solution: "def steps(items, target):\n    left = 0\n    right = len(items) - 1\n    count\
    \ = 0\n    while left <= right:\n        count = count + 1\n        mid = (left + right)\
    \ // 2\n        if items[mid] == target:\n            return count\n        if items[mid]\
    \ < target:\n            left = mid + 1\n        else:\n            right = mid - 1\n\
    \    return count\nn = int(input())\nitems = []\nfor _ in range(n):\n    items.append(int(input()))\n\
    target = int(input())\nprint(steps(items, target))\n"
  explanation: Каждое вычисление середины — один шаг, даже если ответ нашёлся сразу.
  id: python.algorithms.algo-binary.t5
