id: python.http.http-page
slug: http-page
section: http
title: Пагинация
order: 8
weight: 1
prerequisites:
- python.http.http-errors
goal: Вырезать страницу списка по номеру и размеру.
tags:
- пагинация
- page
- size
theory:
- 'Длинный список отдаётся частями: GET /orders?page=2&size=2 просит вторую страницу по два
  элемента. Нумерация страниц здесь начинается с 1.'
- 'Срез считают так: старт равен (page - 1) * size, конец — старт плюс size. Песочница не
  вызывает httpx, страница берётся из обычного списка.'
- Если конец среза раньше длины списка, следующая страница ещё есть. Иначе это последняя страница.
examples:
- title: Вторая страница
  code: "items = ['ель', 'сосна', 'берёза', 'клён']\npage, size = 2, 2\nstart = (page - 1)\
    \ * size\nfor name in items[start:start + size]:\n    print(name)\n"
  explanation: Старт равен 2, срез берёт берёзу и клён.
- title: Есть ли дальше
  code: 'items = [''ель'', ''сосна'', ''берёза'', ''клён'']

    page, size = 1, 2

    end = page * size

    print(''есть ещё'' if end < len(items) else ''конец'')

    '
  explanation: После первой страницы из двух элементов в списке ещё что-то осталось.
outcomes:
- считать старт страницы с номера 1
- резать список по page и size
- понимать запрос GET /orders?page=2&size=2
- замечать, осталась ли следующая страница
resources:
- kind: docs
  title: urllib
  url: https://docs.python.org/3/library/urllib.parse.html
- kind: youtube
  title: CS50P — Lecture 8
  url: https://www.youtube.com/watch?v=5qz5pSO1YTQ
  author: Harvard CS50
tasks:
- type: choice
  title: Какая страница
  difficulty: 1
  context: neutral
  prompt: Что просит запрос GET /orders?page=2&size=2?
  options:
  - id: a
    text: Вторую порцию по два элемента
  - id: b
    text: Все заказы без ограничения
  - id: c
    text: Только код 404
  answer: a
  hints:
  - page — номер порции с единицы.
  - size — длина порции.
  - Это не код ошибки.
  solution: a
  explanation: Пара page и size задаёт срез, а не весь список.
  id: python.http.http-page.t1
- type: predict_output
  title: Первый элемент страницы
  difficulty: 1
  context: neutral
  prompt: Что напечатается?
  options:
  - id: a
    text: берёза
  - id: b
    text: ель
  - id: c
    text: клён
  answer: a
  hints:
  - Старт второй страницы равен 2.
  - Индекс 2 — берёза.
  - клён стоит следом и здесь не печатается.
  solution: a
  explanation: Первый элемент второй страницы — берёза.
  code: 'items = [''ель'', ''сосна'', ''берёза'', ''клён'']

    start = (2 - 1) * 2

    print(items[start])

    '
  id: python.http.http-page.t2
- type: code
  title: Страница склада
  difficulty: 2
  context: development
  prompt: В списке ель, сосна, берёза, клён прочитайте номер страницы и размер. Выведите элементы
    этой страницы.
  starter_code: ''
  tests:
  - stdin: '1

      2

      '
    expected_stdout: 'ель

      сосна

      '
  - stdin: '2

      2

      '
    expected_stdout: 'берёза

      клён

      '
  hints:
  - Страницы считайте с 1.
  - Срез не длиннее size.
  - Печатайте по одному имени.
  solution: "items = ['ель', 'сосна', 'берёза', 'клён']\npage = int(input())\nsize = int(input())\n\
    start = (page - 1) * size\nfor name in items[start:start + size]:\n    print(name)\n"
  explanation: Номер и размер превращаются в границы среза.
  id: python.http.http-page.t3
- type: code
  title: Своя лента
  difficulty: 2
  context: development
  prompt: Прочитайте страницу, размер, число имён и сами имена. Выведите запрошенную страницу.
  starter_code: ''
  tests:
  - stdin: '1

      1

      3

      ель

      сосна

      берёза

      '
    expected_stdout: 'ель

      '
  - stdin: '2

      2

      4

      ель

      сосна

      берёза

      клён

      '
    expected_stdout: 'берёза

      клён

      '
  hints:
  - Сначала параметры страницы, потом элементы.
  - Формула старта та же.
  - Если срез короче, печатайте сколько есть.
  solution: "page = int(input())\nsize = int(input())\ncount = int(input())\nitems = [input().strip()\
    \ for _ in range(count)]\nstart = (page - 1) * size\nfor name in items[start:start + size]:\n\
    \    print(name)\n"
  explanation: Лента приходит из ввода, формула страницы не меняется.
  id: python.http.http-page.t4
- type: code
  title: Есть ли следующая
  difficulty: 2
  context: development
  prompt: Для списка ель, сосна, берёза, клён прочитайте страницу и размер. Выведите есть
    ещё или конец.
  starter_code: ''
  tests:
  - stdin: '1

      2

      '
    expected_stdout: 'есть ещё

      '
  - stdin: '2

      2

      '
    expected_stdout: 'конец

      '
  hints:
  - Конец страницы — старт плюс размер.
  - Сравнивайте его с длиной.
  - Равенство длине уже означает конец.
  solution: 'items = [''ель'', ''сосна'', ''берёза'', ''клён'']

    page = int(input())

    size = int(input())

    end = (page - 1) * size + size

    print(''есть ещё'' if end < len(items) else ''конец'')

    '
  explanation: Следующая страница есть, только если после среза остались элементы.
  id: python.http.http-page.t5
introduces:
- id: http-page
  title: Страница выдачи
  summary: Порция списка. Запрос GET /orders?page=2&size=2 берёт вторую порцию длиной 2.
