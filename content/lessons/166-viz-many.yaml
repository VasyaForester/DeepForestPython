id: python.viz.viz-many
slug: viz-many
section: viz
title: Несколько графиков
order: 4
weight: 1
prerequisites:
- python.viz.viz-labels
goal: Держать рядом два ряда и сравнивать их суммы.
tags:
- несколько графиков
theory:
- 'Два ряда на одном рисунке или на двух панелях сравнивают условия: север и юг, март и апрель.
  В matplotlib панели задаёт plt.subplot, а второй ряд на тех же осях — ещё один plt.plot.'
- Общая шкала важнее украшения. Если у рядов разные единицы, их не кладут на одну ось. Сумма
  каждого ряда — короткая проверка, кто больше.
- Упражнение печатает обе суммы, потому что matplotlib нет в среде браузера.
examples:
- title: Север и юг
  code: 'north = [3, 5, 2]

    south = [1, 1, 4]

    print(sum(north))

    print(sum(south))

    '
  explanation: Север дал 10 посадок, юг 6. Это итоги двух линий.
- title: Кто больше
  code: 'march = [4, 4]

    april = [9]

    print("апрель" if sum(april) > sum(march) else "март")

    '
  explanation: 9 больше 8, поэтому больше апрель.
outcomes:
- сравнивать два ряда на одном вопросе
- считать сумму каждого ряда
- не смешивать разные единицы на одной оси
- называть ряд с большим итогом
resources:
- kind: docs
  title: The Python Tutorial
  url: https://docs.python.org/3/tutorial/index.html
- kind: youtube
  title: CS50P — Lecture 6
  url: https://www.youtube.com/watch?v=z9cz-sS9a1A
  author: Harvard CS50
tasks:
- type: choice
  title: Две панели
  difficulty: 1
  context: neutral
  prompt: Зачем нужны два графика или два ряда на одном рисунке?
  options:
  - id: a
    text: Чтобы сравнить два ряда в одной шкале смысла
  - id: b
    text: Чтобы скрыть минимум
  - id: c
    text: Чтобы заменить подписи осей
  answer: a
  hints:
  - Сравнение требует общего вопроса.
  - Минимум не прячут специально.
  - Подписи нужны каждому ряду.
  solution: a
  explanation: Второй ряд имеет смысл, если его можно честно сравнить с первым.
  id: python.viz.viz-many.t1
- type: predict_output
  title: Две суммы
  difficulty: 1
  context: neutral
  prompt: Что напечатает программа?
  options:
  - id: a
    text: 8 8
  - id: b
    text: 3 4
  - id: c
    text: '15'
  answer: a
  hints:
  - Каждый список суммируется отдельно.
  - 3+5 и 4+4.
  - Печатаются обе суммы.
  solution: a
  explanation: Оба ряда дают 8.
  code: 'north = [3, 5]

    south = [4, 4]

    print(sum(north), sum(south))

    '
  id: python.viz.viz-many.t2
- type: code
  title: Две суммы рядов
  difficulty: 2
  context: development
  prompt: Прочитайте n, затем n чисел севера и n чисел юга. Выведите сумму севера и сумму
    юга.
  starter_code: ''
  tests:
  - stdin: '3

      3

      5

      2

      1

      1

      4

      '
    expected_stdout: '10

      6

      '
  - stdin: '1

      7

      8

      '
    expected_stdout: '7

      8

      '
  hints:
  - Сложите каждый ряд отдельно.
  - Длины рядов равны.
  - 'Порядок ответа: север, юг.'
  solution: 'n = int(input())

    north = sum(int(input()) for _ in range(n))

    south = sum(int(input()) for _ in range(n))

    print(north)

    print(south)

    '
  explanation: Две суммы — черновая подпись к двум линиям.
  id: python.viz.viz-many.t3
- type: code
  title: Какой ряд больше
  difficulty: 2
  context: development
  prompt: Прочитайте два ряда одной длины, как в прошлой задаче. Выведите север, юг или равно.
  starter_code: ''
  tests:
  - stdin: '2

      4

      4

      9

      1

      '
    expected_stdout: 'юг

      '
  - stdin: '1

      5

      5

      '
    expected_stdout: 'равно

      '
  hints:
  - Сравнивайте суммы, не отдельные дни.
  - Равенство печатает равно.
  - Имена рядов пишите строчными буквами.
  solution: "n = int(input())\nnorth = sum(int(input()) for _ in range(n))\nsouth = sum(int(input())\
    \ for _ in range(n))\nif north > south:\n    print(\"север\")\nelif south > north:\n \
    \   print(\"юг\")\nelse:\n    print(\"равно\")\n"
  explanation: Сравнение итогов говорит, какой ряд выше целиком.
  id: python.viz.viz-many.t4
- type: code
  title: Разность итогов
  difficulty: 2
  context: development
  prompt: Прочитайте два ряда одной длины. Выведите сумму севера минус сумму юга.
  starter_code: ''
  tests:
  - stdin: '3

      3

      5

      2

      1

      1

      4

      '
    expected_stdout: '4

      '
  - stdin: '1

      2

      9

      '
    expected_stdout: '-7

      '
  hints:
  - Север минус юг может быть отрицательным.
  - Сначала две суммы.
  - Одно число в ответе.
  solution: 'n = int(input())

    north = sum(int(input()) for _ in range(n))

    south = sum(int(input()) for _ in range(n))

    print(north - south)

    '
  explanation: Знак разности показывает, какой ряд больше.
  id: python.viz.viz-many.t5
introduces:
- id: viz-multi-chart
  title: Несколько рядов
  summary: Два графика или два ряда для сравнения. В matplotlib панели задаёт plt.subplot.
