id: python.sql.sql-window
slug: sql-window
section: sql
title: Оконные функции
order: 10
weight: 1
prerequisites:
- python.sql.sql-cte
goal: Пронумеровать деревья и посчитать сумму города, не схлопывая строки.
tags:
- ROW_NUMBER
- OVER
- PARTITION BY
theory:
- Оконная функция считает значение по набору строк и не схлопывает их, в отличие от GROUP
  BY. ROW_NUMBER() OVER (ORDER BY height DESC) нумерует деревья с самого высокого.
- SUM(amount) OVER (PARTITION BY city) пишет сумму города в каждую его строку. У заказа Москвы
  рядом окажется 25, у заказа Казани — 16, а сами заказы не исчезнут.
- Номер и сумму достают из подзапроса, где окно уже посчитано. В таблице по-прежнему ель 12,
  сосна 20, берёза 30.
examples:
- title: Номер один
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.executemany(''insert into trees values (?, ?)'', [(''ель'', 12), (''сосна'', 20),
    (''берёза'', 30)])

    row = con.execute(''select name from (select name, row_number() over (order by height
    desc) as n from trees) where n = 1'').fetchone()

    print(row[0])

    '
  explanation: Окно сортирует по убыванию высоты, номер 1 получает берёза.
- title: Сумма рядом со строкой
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table orders(city text, amount int)'')

    con.executemany(''insert into orders values (?, ?)'', [(''Москва'', 10), (''Москва'',
    15)])

    row = con.execute(''select sum(amount) over (partition by city) from orders'').fetchone()

    print(row[0])

    '
  explanation: Обе московские строки видят одну и ту же сумму раздела, 25.
outcomes:
- нумеровать строки через ROW_NUMBER
- задавать порядок окна в OVER
- считать SUM по PARTITION BY
- не путать окно со свёрткой GROUP BY
