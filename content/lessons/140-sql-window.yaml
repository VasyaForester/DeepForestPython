- type: code
  title: Имя по месту
  difficulty: 2
  context: development
  prompt: Прочитайте номер места с 1. Выведите имя дерева с таким ROW_NUMBER по убыванию высоты.
  starter_code: ''
  tests:
  - stdin: '1

      '
    expected_stdout: 'берёза

      '
  - stdin: '2

      '
    expected_stdout: 'сосна

      '
  hints:
  - Окно упорядочите по height DESC.
  - Номер фильтруйте снаружи.
  - Подставьте место через ?.
  solution: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.executemany(''insert into trees values (?, ?)'', [(''ель'', 12), (''сосна'', 20),
    (''берёза'', 30)])

    rank = int(input())

    query = ''select name from (select name, row_number() over (order by height desc) as n
    from trees) where n = ?''

    row = con.execute(query, (rank,)).fetchone()

    print(row[0])

    '
  explanation: Место 1 — берёза, место 2 — сосна.
