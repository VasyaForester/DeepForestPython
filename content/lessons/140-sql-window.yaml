  difficulty: 1
  context: neutral
  prompt: Чем ROW_NUMBER() OVER (ORDER BY height DESC) отличается от GROUP BY?
  options:
  - id: a
    text: Нумерует строки и не схлопывает их в одну группу
  - id: b
    text: Удаляет столбец height
  - id: c
