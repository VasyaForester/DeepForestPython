  starter_code: ''
  tests:
  - stdin: 'берёза

      '
    expected_stdout: '1

      '
  - stdin: 'ель

      '
    expected_stdout: '3

      '
  hints:
  - Фильтр снаружи ищет имя.
  - Печатайте столбец номера.
  - Ель ниже всех и получает номер 3.
  solution: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.executemany(''insert into trees values (?, ?)'', [(''ель'', 12), (''сосна'', 20),
    (''берёза'', 30)])

    name = input().strip()

    query = ''select n from (select name, row_number() over (order by height desc) as n from
    trees) where name = ?''

    row = con.execute(query, (name,)).fetchone()

    print(row[0])

    '
  explanation: Окно нумерует все строки, имя только выбирает одну.
  id: python.sql.sql-window.t4
- type: code
  title: Сумма раздела
  difficulty: 2
  context: development
  prompt: 'Заказы: Москва 10 и 15, Казань 7, 8 и 1. Прочитайте город и выведите сумму его
    раздела.'
  starter_code: ''
  tests:
  - stdin: 'Москва

      '
    expected_stdout: '25

      '
  - stdin: 'Казань

      '
    expected_stdout: '16

      '
  hints:
  - PARTITION BY city делит окно по городам.
  - LIMIT 1 берёт сумму один раз.
  - Город фильтруйте через ?.
  solution: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table orders(city text, amount int)'')

    con.executemany(''insert into orders values (?, ?)'', [(''Москва'', 10), (''Москва'',
    15), (''Казань'', 7), (''Казань'', 8), (''Казань'', 1)])

    city = input().strip()

    query = ''select total from (select city, sum(amount) over (partition by city) as total
    from orders) where city = ? limit 1''

    row = con.execute(query, (city,)).fetchone()

    print(row[0])

    '
  explanation: Сумма раздела одинакова у всех заказов города.
  id: python.sql.sql-window.t5
