id: python.conditions.review
slug: loops-review
section: conditions
title: Итог раздела. Обработка потока данных
order: 10
weight: 2
prerequisites:
  - python.conditions.loop-errors
goal: Прочитать серию значений, проверить каждое и собрать отчёт за один проход.
tags: [итог, цикл, условие, отчёт, статистика]
theory:
  - "Почти любая обработка данных устроена одинаково: заранее известно или читается количество записей, затем цикл проходит по ним и обновляет несколько накопителей, а после цикла программа печатает отчёт. Новых понятий в этом уроке нет."
  - "Накопители стоит перечислить до цикла и сразу решить, с какого значения начинается каждый: сумма с нуля, счётчик с нуля, максимум с первого прочитанного значения, флаг с True или False в зависимости от смысла проверки."
  - "Один проход лучше нескольких: данные читаются по одной строке и второй раз уже недоступны. Поэтому всё, что нужно для отчёта, собирают сразу, в одном цикле."
examples:
  - title: Отчёт по потоку чисел
    code: |
      n = int(input())
      total = 0
      positive = 0
      for _ in range(n):
          value = int(input())
          total = total + value
          if value > 0:
              positive = positive + 1
      print(f"Сумма: {total}")
      print(f"Положительных: {positive}")
      print(f"Среднее: {total / n:.2f}")
    stdin: "4\n10\n-2\n8\n4\n"
    explanation: Два накопителя обновляются в одном цикле, а отчёт собирается после него.
  - title: Флаг по всем значениям
    code: |
      n = 3
      all_even = True
      for step in range(n):
          value = step * 2 + 1
          if value % 2 == 1:
              all_even = False
      print(all_even)
    explanation: Флаг начинается с True и становится ложным при первом же несоответствии. Так проверяют утверждение обо всех значениях сразу.
outcomes:
  - читать серию значений в цикле
  - обновлять несколько накопителей за один проход
  - проверять утверждение обо всех значениях через флаг
  - собирать итоговый отчёт после цикла
resources:
  - kind: docs
    title: More Control Flow Tools
    url: https://docs.python.org/3/tutorial/controlflow.html
  - kind: youtube
    title: CS50P — Lecture 2
    url: https://www.youtube.com/watch?v=Kd_1Hesmdeo
    author: Harvard CS50
tasks:
  - id: python.conditions.review.t1
    type: code
    title: Сумма и количество
    difficulty: 3
    context: analytics
    prompt: Первая строка — количество чисел n, далее n строк с целыми числами. Выведите две строки с суммой и количеством отрицательных значений по образцу из тестов.
    starter_code: |
      n = int(input())
    tests:
      - stdin: "4\n10\n-2\n8\n-4\n"
        expected_stdout: "Сумма: 12\nОтрицательных: 2\n"
      - stdin: "2\n5\n5\n"
        expected_stdout: "Сумма: 10\nОтрицательных: 0\n"
    hints:
      - Оба накопителя создайте до цикла.
      - Значение прочитайте в переменную, оно нужно дважды.
      - Счётчик увеличивайте только при отрицательном значении.
    solution: |
      n = int(input())
      total = 0
      negative = 0
      for _ in range(n):
          value = int(input())
          total = total + value
          if value < 0:
              negative = negative + 1
      print(f"Сумма: {total}")
      print(f"Отрицательных: {negative}")
    explanation: Значение сохраняется в переменную, потому что участвует и в сумме, и в проверке.
  - id: python.conditions.review.t2
    type: code
    title: Все значения в норме
    difficulty: 3
    context: security
    prompt: Первая строка — количество измерений n, далее n строк с целыми числами. Выведите True, если все значения лежат в диапазоне от 0 до 100 включительно, иначе False.
    starter_code: ""
    tests:
      - stdin: "3\n10\n50\n100\n"
        expected_stdout: "True\n"
      - stdin: "3\n10\n140\n20\n"
        expected_stdout: "False\n"
      - stdin: "2\n-1\n5\n"
        expected_stdout: "False\n"
    hints:
      - Флаг начинается с True.
      - Проверяйте попадание в диапазон цепочкой сравнений.
      - Одно нарушение делает флаг ложным навсегда.
    solution: |
      n = int(input())
      all_ok = True
      for _ in range(n):
          value = int(input())
          if not (0 <= value <= 100):
              all_ok = False
      print(all_ok)
    explanation: "Флаг отвечает на вопрос обо всех значениях: он сбрасывается при первом нарушении и больше не возвращается к True."
  - id: python.conditions.review.t3
    type: code
    title: Максимум и его номер
    difficulty: 4
    context: analytics
    prompt: Первая строка — количество измерений n, далее n строк с целыми числами. Выведите наибольшее значение и его номер в порядке ввода, считая от единицы, по образцу из тестов. Если максимум встречается несколько раз, выведите номер первого.
    starter_code: ""
    tests:
      - stdin: "4\n3\n17\n9\n17\n"
        expected_stdout: "Максимум: 17\nНомер: 2\n"
      - stdin: "3\n-5\n-20\n-7\n"
        expected_stdout: "Максимум: -5\nНомер: 1\n"
    hints:
      - Первое значение прочитайте до цикла и примите за максимум с номером 1.
      - Остальных значений останется n минус один.
      - Заменяйте максимум только при строго большем значении.
    solution: |
      n = int(input())
      best = int(input())
      best_index = 1
      for step in range(n - 1):
          value = int(input())
          if value > best:
              best = value
              best_index = step + 2
      print(f"Максимум: {best}")
      print(f"Номер: {best_index}")
    explanation: Строгое сравнение сохраняет номер первого максимума. Номер считается от переменной цикла с поправкой на прочитанное до него значение.
  - id: python.conditions.review.t4
    type: code
    title: Отчёт по заказам
    difficulty: 4
    context: business
    prompt: Первая строка — количество заказов n, далее n строк с суммами заказов дробными числами. Выведите выручку с двумя знаками после точки, число крупных заказов на сумму от 1000 и их долю в процентах с одним знаком после точки по образцу из тестов.
    starter_code: ""
    tests:
      - stdin: "4\n1200.0\n300.5\n1000.0\n99.5\n"
        expected_stdout: "Выручка: 2600.00\nКрупных: 2\nДоля: 50.0%\n"
      - stdin: "2\n10.0\n20.0\n"
        expected_stdout: "Выручка: 30.00\nКрупных: 0\nДоля: 0.0%\n"
    hints:
      - Суммы читайте через float, количество заказов через int.
      - Граница 1000 входит в крупные, сравнение нестрогое.
      - Долю считают от общего числа заказов, а не от выручки.
    solution: |
      n = int(input())
      revenue = 0.0
      big = 0
      for _ in range(n):
          amount = float(input())
          revenue = revenue + amount
          if amount >= 1000:
              big = big + 1
      print(f"Выручка: {revenue:.2f}")
      print(f"Крупных: {big}")
      print(f"Доля: {big / n * 100:.1f}%")
    explanation: "Один проход даёт все три числа отчёта: сумму, количество по условию и долю, посчитанную уже после цикла."
  - id: python.conditions.review.t5
    type: code
    title: Самая длинная серия успехов
    difficulty: 4
    context: security
    prompt: Первая строка — количество проверок n, далее n строк, в каждой 1 для успеха или 0 для отказа. Выведите длину самой длинной серии подряд идущих успехов.
    starter_code: ""
    tests:
      - stdin: "6\n1\n1\n0\n1\n1\n1\n"
        expected_stdout: "3\n"
      - stdin: "3\n0\n0\n0\n"
        expected_stdout: "0\n"
      - stdin: "2\n1\n1\n"
        expected_stdout: "2\n"
    hints:
      - Нужны два накопителя: текущая серия и лучшая.
      - При отказе текущая серия обнуляется.
      - Лучшую серию обновляйте сразу после увеличения текущей.
    solution: |
      n = int(input())
      current = 0
      best = 0
      for _ in range(n):
          if int(input()) == 1:
              current = current + 1
              if current > best:
                  best = current
          else:
              current = 0
      print(best)
    explanation: Текущая серия растёт на успехах и сбрасывается на отказе, а лучшая запоминает наибольшее достигнутое значение.
