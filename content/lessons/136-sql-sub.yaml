id: python.sql.sql-sub
slug: sql-sub
section: sql
title: Подзапросы
order: 6
weight: 1
prerequisites:
- python.sql.sql-case
goal: Сравнить строку с результатом другого SELECT.
tags:
- подзапрос
- AVG
- MAX
theory:
- Подзапрос — SELECT внутри другого запроса. SELECT name FROM trees WHERE height > (SELECT
  AVG(height) FROM trees) оставляет деревья выше средней высоты.
- В таблице ель 12, сосна 20, берёза 30. Среднее больше 20, поэтому строго выше него только
  берёза. SELECT MAX(height) и SELECT MIN(height) тоже подзапросы.
- Внешний запрос видит одно число из внутреннего. Имя снаружи сравнивают уже с этим числом,
  а не вычисляют среднее в Python.
examples:
- title: Выше среднего
  code: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table trees(name\
    \ text, height int)')\ncon.executemany('insert into trees values (?, ?)', [('ель', 12),\
    \ ('сосна', 20), ('берёза', 30)])\nfor row in con.execute('select name from trees where\
    \ height > (select avg(height) from trees) order by name'):\n    print(row[0])\n"
  explanation: Среднее трёх высот выше 20, условие проходит только берёза.
- title: Максимум
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.executemany(''insert into trees values (?, ?)'', [(''ель'', 12), (''сосна'', 20),
    (''берёза'', 30)])

    row = con.execute(''select name from trees where height = (select max(height) from trees)'').fetchone()

    print(row[0])

    '
  explanation: Внутренний MAX возвращает 30, внешний запрос находит берёзу.
outcomes:
- вкладывать SELECT в условие
- сравнивать высоту со средним
- находить минимум и максимум подзапросом
- подписывать одну строку относительно агрегата всей таблицы
