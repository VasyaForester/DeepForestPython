- type: choice
  title: Где подзапрос
  difficulty: 1
  context: neutral
  prompt: Что делает скобка в SELECT name FROM trees WHERE height > (SELECT AVG(height) FROM
    trees)?
  options:
  - id: a
    text: Считает среднее отдельным запросом и сравнивает с ним высоту
  - id: b
    text: Удаляет столбец height
  - id: c
    text: Сортирует имена по алфавиту
