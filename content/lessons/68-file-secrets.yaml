id: python.files.file-secrets
slug: file-secrets
section: files
title: Случайность и secrets
order: 10
weight: 1
prerequisites:
- python.files.file-collections
goal: Выбрать элемент списка по переданному индексу и не путать random с secrets.
tags:
- secrets
- random
- индекс
theory:
- 'Выбор из списка можно сделать чистой функцией: она получает список и индекс и возвращает
  элемент. Результат зависит только от аргументов, его легко проверить на примерах.'
- Модуль random для секрета не подходит. Его последовательность можно продолжить, если известно
  начальное состояние. Пароль, токен или код доступа так подбирать нельзя.
- 'Для таких значений есть модуль secrets: им пользуются, когда угадывание недопустимо. Здесь
  индекс передают явно, поэтому ни random, ни secrets в программе не нужны.'
examples:
- title: По индексу
  code: "def pick(items, index):\n    return items[index]\nprint(pick(['ель', 'сосна', 'дуб'],\
    \ 0))\nprint(pick(['ель', 'сосна', 'дуб'], 2))\n"
  explanation: Индекс 0 — ель, индекс 2 — дуб. Функция не выбирает элемент сама.
- title: Остаток
  code: "def pick(items, index):\n    return items[index % len(items)]\nprint(pick(['A14',\
    \ 'B02', 'C77'], 3))\n"
  explanation: 3 делится на длину 3 без остатка, остаток 0, поэтому берётся A14.
outcomes:
- выбирать элемент списка по индексу
- не использовать random для секретов
- объяснять, зачем существует secrets
- укладывать индекс в длину списка через остаток
resources:
- kind: docs
  title: Reading and Writing Files
  url: https://docs.python.org/3/tutorial/inputoutput.html#reading-and-writing-files
- kind: youtube
  title: CS50P — Lecture 6
  url: https://www.youtube.com/watch?v=z9cz-sS9a1A
  author: Harvard CS50
tasks:
- type: choice
  title: secrets или random
  difficulty: 1
  context: neutral
  prompt: Чем выбирать код доступа, который нельзя угадать?
  options:
  - id: a
    text: Модулем secrets
  - id: b
    text: Модулем random
  - id: c
    text: Делением номера заказа на 10
  answer: a
  hints:
  - random можно восстановить по начальному состоянию.
  - Секретам нужен модуль secrets.
  - Арифметика номера предсказуема.
  solution: a
  explanation: random не для паролей и токенов. Для них предназначен secrets.
  id: python.files.file-secrets.t1
- type: predict_output
  title: Какой элемент
  difficulty: 1
  context: neutral
  prompt: Что напечатает программа?
  options:
  - id: a
    text: ель
  - id: b
    text: дуб
  - id: c
    text: '2'
  answer: b
  hints:
  - Индекс 2 — третий элемент.
  - Счёт идёт с нуля.
  - Печатается элемент, не номер.
  solution: b
  explanation: На индексе 2 стоит дуб.
  code: "def pick(items, index):\n    return items[index]\nprint(pick(['ель', 'сосна', 'дуб'],\
    \ 2))\n"
  id: python.files.file-secrets.t2
- type: code
  title: Порода по номеру
  difficulty: 2
  context: security
  prompt: В списке ель, сосна, дуб. Прочитайте индекс и выведите породу через функцию pick.
  starter_code: ''
  tests:
  - stdin: '1

      '
    expected_stdout: 'сосна

      '
  - stdin: '0

      '
    expected_stdout: 'ель

      '
  hints:
  - Индекс приходит из ввода.
  - pick возвращает элемент.
  - Печатайте результат вызова.
  solution: "def pick(items, index):\n    return items[index]\nprint(pick(['ель', 'сосна',\
    \ 'дуб'], int(input())))\n"
  explanation: Индекс 1 — сосна, индекс 0 — ель.
  id: python.files.file-secrets.t3
- type: code
  title: Код по остатку
  difficulty: 2
  context: security
  prompt: Коды A14, B02 и C77 лежат в списке. Прочитайте целое число и выведите код с индексом,
    равным остатку от деления на длину списка.
  starter_code: ''
  tests:
  - stdin: '1

      '
    expected_stdout: 'B02

      '
  - stdin: '3

      '
    expected_stdout: 'A14

      '
  hints:
  - Остаток от деления не выходит за список.
  - Длина списка равна 3.
  - Индекс 3 даёт тот же элемент, что и 0.
  solution: "def pick(items, index):\n    return items[index % len(items)]\nprint(pick(['A14',\
    \ 'B02', 'C77'], int(input())))\n"
  explanation: 1 выбирает B02. 3 даёт остаток 0 и код A14.
  id: python.files.file-secrets.t4
- type: code
  title: Слово из строки
  difficulty: 2
  context: development
  prompt: Прочитайте слова через пробел, затем со следующей строки индекс. Функция pick возвращает
    слово с этим индексом.
  starter_code: ''
  tests:
  - stdin: 'ель сосна дуб

      2

      '
    expected_stdout: 'дуб

      '
  - stdin: 'кедр бук

      0

      '
    expected_stdout: 'кедр

      '
  hints:
  - Сначала список слов.
  - Потом индекс.
  - split убирает пробелы.
  solution: "def pick(items, index):\n    return items[index]\nprint(pick(input().split(),\
    \ int(input())))\n"
  explanation: Индекс 2 в первой строке — дуб, индекс 0 во второй — кедр.
  id: python.files.file-secrets.t5
introduces:
- id: file-secrets.secrets
  title: secrets
  summary: Модуль для значений, которые нельзя угадать. random для паролей и токенов не подходит.
