tasks:
- type: choice
  title: Чем ALL отличается
  difficulty: 1
  context: neutral
  prompt: Чем SELECT name FROM trees UNION ALL SELECT name FROM shrubs отличается от UNION
    без ALL?
  options:
  - id: a
    text: ALL сохраняет повторяющиеся имена
  - id: b
    text: ALL удаляет все строки
  - id: c
    text: ALL сортирует по высоте
  answer: a
  hints:
  - Обычный UNION убирает дубликаты.
  - ALL нужен, когда каждая строка важна.
  - Высоты в этих таблицах нет.
  solution: a
  explanation: UNION ALL не выбрасывает повтор ели.
  id: python.sql.sql-union.t1
