id: python.sql.sql-union
slug: sql-union
section: sql
title: UNION
order: 8
weight: 1
prerequisites:
- python.sql.sql-join
goal: Сложить имена из двух таблиц и решить, убирать ли повторы.
tags:
- UNION
- UNION ALL
theory:
- UNION соединяет результаты двух SELECT и убирает повторы. UNION ALL сохраняет каждую строку,
  даже если ель есть и среди деревьев, и среди кустов.
- В деревьях ель и сосна, в кустах ель и сирень. Запрос SELECT name FROM trees UNION SELECT
  name FROM shrubs даёт три имени, а UNION ALL — четыре строки.
- ORDER BY name в конце сортирует уже объединённый результат. Проверка «есть ли имя хотя бы
  в одной таблице» тоже делается через UNION внутри подзапроса.
examples:
- title: Без повтора ели
  code: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table trees(name\
    \ text)')\ncon.execute('create table shrubs(name text)')\ncon.executemany('insert into\
    \ trees values (?)', [('ель',), ('сосна',)])\ncon.executemany('insert into shrubs values\
    \ (?)', [('ель',), ('сирень',)])\nfor row in con.execute('select name from trees union\
    \ select name from shrubs order by name'):\n    print(row[0])\n"
  explanation: UNION оставляет одну ель. По алфавиту идут ель, сирень, сосна.
- title: С повтором
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text)'')

    con.execute(''create table shrubs(name text)'')

    con.execute("insert into trees values (''ель'')")

    con.execute("insert into shrubs values (''ель'')")

    row = con.execute(''select count(*) from (select name from trees union all select name
    from shrubs)'').fetchone()

    print(row[0])

    '
  explanation: UNION ALL не схлопывает две ели, поэтому строк две.
outcomes:
- склеивать два SELECT через UNION
- сохранять повторы через UNION ALL
- сортировать объединённый результат
- искать имя сразу в двух таблицах
