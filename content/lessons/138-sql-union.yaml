  - Ель повторяется и схлопывается.
  - Остаются ель, сосна и сирень.
  solution: a
  explanation: После UNION различных имён три.
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text)'')

    con.execute(''create table shrubs(name text)'')

    con.executemany(''insert into trees values (?)'', [(''ель'',), (''сосна'',)])

    con.executemany(''insert into shrubs values (?)'', [(''ель'',), (''сирень'',)])

    rows = list(con.execute(''select name from trees union select name from shrubs''))

    print(len(rows))

    '
  id: python.sql.sql-union.t2
- type: code
  title: ALL или без повторов
  difficulty: 2
  context: development
  prompt: 'Прочитайте ALL или DISTINCT. Выведите имена деревьев и кустов: для ALL с повтором
    ели, иначе без повтора. Сортируйте по имени.'
  starter_code: ''
  tests:
  - stdin: 'ALL

      '
    expected_stdout: 'ель

      ель

      сирень

      сосна

      '
  - stdin: 'DISTINCT

      '
    expected_stdout: 'ель

      сирень

      сосна

      '
  hints:
  - Держите два запроса.
  - ORDER BY относится ко всему объединению.
  - DISTINCT здесь означает обычный UNION.
  solution: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table\
    \ trees(name text)')\ncon.execute('create table shrubs(name text)')\ncon.executemany('insert\
    \ into trees values (?)', [('ель',), ('сосна',)])\ncon.executemany('insert into shrubs\
    \ values (?)', [('ель',), ('сирень',)])\nmode = input().strip()\nif mode == 'ALL':\n \
    \   query = 'select name from trees union all select name from shrubs order by name'\n\
    else:\n    query = 'select name from trees union select name from shrubs order by name'\n\
    for row in con.execute(query):\n    print(row[0])\n"
  explanation: 'Разница видна по второй ели: ALL её сохраняет.'
  id: python.sql.sql-union.t3
