- type: code
  title: Есть ли имя
  difficulty: 2
  context: development
  prompt: Прочитайте имя. Выведите есть, если оно встречается в деревьях или кустах, иначе
    нет.
  starter_code: ''
  tests:
  - stdin: 'ель

      '
    expected_stdout: 'есть

      '
  - stdin: 'берёза

      '
    expected_stdout: 'нет

      '
  hints:
  - UNION собирает оба списка.
  - Внешний WHERE ищет имя через ?.
  - Ноль означает нет.
  solution: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text)'')

    con.execute(''create table shrubs(name text)'')

    con.executemany(''insert into trees values (?)'', [(''ель'',), (''сосна'',)])

    con.executemany(''insert into shrubs values (?)'', [(''ель'',), (''сирень'',)])

    name = input().strip()

    query = ''select count(*) from (select name from trees union select name from shrubs)
    where name = ?''

    row = con.execute(query, (name,)).fetchone()

    print(''есть'' if row[0] else ''нет'')

    '
  explanation: Имя считается найденным, если оно есть хотя бы в одной таблице.
  id: python.sql.sql-union.t5
