id: python.files.file-collections
slug: file-collections
section: files
title: collections
order: 9
weight: 1
prerequisites:
- python.files.file-math
goal: Считать повторы через Counter и брать первый элемент очереди deque.
tags:
- Counter
- deque
theory:
- 'collections.Counter считает, сколько раз встретился каждый элемент. Counter от списка пород
  работает как словарь: counts["ель"] — число елей, отсутствующая порода даёт 0.'
- most_common(1) возвращает список пар (элемент, число). Первая пара — самый частый элемент.
  При равенстве остаётся тот, кто встретился раньше.
- collections.deque — очередь. append добавляет в конец, popleft снимает с начала. Так первая
  пришедшая порода уходит первой.
examples:
- title: Сколько елей
  code: 'from collections import Counter

    counts = Counter([''ель'', ''ель'', ''сосна''])

    print(counts[''ель''])

    print(counts[''дуб''])

    '
  explanation: Ель встретилась дважды. Дуба в списке нет, Counter возвращает 0.
- title: Очередь
  code: 'from collections import deque

    line = deque([''ель'', ''сосна''])

    line.append(''дуб'')

    print(line.popleft())

    print(line.popleft())

    '
  explanation: Дуб встал в конец. Первый popleft забирает ель, второй — сосну.
outcomes:
- считать повторы через Counter
- получать 0 для отсутствующего ключа
- выбирать самый частый элемент
- снимать первый элемент deque
