id: python.data.data-group
slug: data-group
section: data
title: Группировка
order: 13
weight: 1
prerequisites:
- python.data.data-na
goal: Складывать значения по имени группы.
tags:
- groupby
- agg
theory:
- Группировка собирает строки с одинаковым ключом. В pandas df.groupby('порода')['высота'].sum()
  даёт сумму высот каждой породы.
- 'agg — это правило свёртки: sum, count, min. Одна группировка может посчитать несколько
  правил, но смысл тот же: сначала ключ, потом расчёт внутри группы.'
- Упражнение копит суммы в словаре, потому что pandas нет в среде браузера.
examples:
- title: Суммы пород
  code: "rows = [{\"порода\": \"ель\", \"высота\": 12}, {\"порода\": \"сосна\", \"высота\"\
    : 9}, {\"порода\": \"ель\", \"высота\": 15}]\ngroups = {}\nfor row in rows:\n    groups.setdefault(row[\"\
    порода\"], []).append(row[\"высота\"])\nprint(sum(groups[\"ель\"]))\nprint(len(groups[\"\
    сосна\"]))\n"
  explanation: У ели две высоты, сумма 27. У сосны одна запись.
- title: Число чеков
  code: "sales = [(\"север\", 3), (\"юг\", 1), (\"север\", 2)]\ncounts = {}\nfor park, count\
    \ in sales:\n    counts[park] = counts.get(park, 0) + count\nprint(counts[\"север\"])\n\
    print(counts[\"юг\"])\n"
  explanation: Север сложил 3 и 2. Юг остался с 1.
outcomes:
- собирать строки по ключу
- суммировать значения внутри группы
- считать число групп
- читать groupby и agg как ключ плюс свёртку
