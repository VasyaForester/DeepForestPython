  id: python.sql.sql-group.t4
- type: code
  title: Чья группа больше
  difficulty: 2
  context: development
  prompt: Прочитайте sum или count. Выведите город с наибольшей суммой либо с наибольшим числом
    заказов.
  starter_code: ''
  tests:
  - stdin: 'sum

      '
    expected_stdout: 'Москва

      '
  - stdin: 'count

      '
    expected_stdout: 'Казань

      '
  hints:
  - GROUP BY city обязателен перед агрегатом в ORDER BY.
  - Для суммы и для счётчика разные запросы.
  - LIMIT 1 оставляет победителя.
  solution: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table\
    \ orders(city text, amount int)')\ncon.executemany('insert into orders values (?, ?)',\
    \ [('Москва', 10), ('Москва', 15), ('Казань', 7), ('Казань', 8), ('Казань', 1)])\nkind\
    \ = input().strip()\nif kind == 'sum':\n    query = 'select city from orders group by\
    \ city order by sum(amount) desc limit 1'\nelse:\n    query = 'select city from orders\
    \ group by city order by count(*) desc limit 1'\nrow = con.execute(query).fetchone()\n\
    print(row[0])\n"
  explanation: По сумме побеждает Москва, по числу заказов — Казань.
  id: python.sql.sql-group.t5
