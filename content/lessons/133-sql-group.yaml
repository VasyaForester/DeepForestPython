id: python.sql.sql-group
slug: sql-group
section: sql
title: GROUP BY и агрегаты
order: 3
weight: 1
prerequisites:
- python.sql.sql-order
goal: Свернуть строки города в сумму и количество.
tags:
- GROUP BY
- SUM
- COUNT
theory:
- Запрос SELECT city, SUM(amount) FROM orders GROUP BY city даёт одну строку на город. SUM
  складывает суммы заказов, COUNT(*) считает сами заказы.
- 'В таблице пять заказов: Москва 10, Москва 15, Казань 7, Казань 8, Казань 1. Сумма Москвы
  25 при двух заказах, сумма Казани 16 при трёх.'
- Группировка делается в SQL, не циклом по уже выгруженным строкам. Город для поиска передают
  через ?.
examples:
- title: Сумма Москвы
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table orders(city text, amount int)'')

    con.executemany(''insert into orders values (?, ?)'', [(''Москва'', 10), (''Москва'',
    15), (''Казань'', 7), (''Казань'', 8), (''Казань'', 1)])

    row = con.execute("select sum(amount) from orders group by city having city = ''Москва''").fetchone()

    print(row[0])

    '
  explanation: Две московские суммы складываются в 25.
- title: Число заказов
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table orders(city text, amount int)'')

    con.executemany(''insert into orders values (?, ?)'', [(''Москва'', 10), (''Москва'',
    15), (''Казань'', 7)])

    row = con.execute("select count(*) from orders where city = ''Казань''").fetchone()

    print(row[0])

    '
  explanation: В этом коротком наборе у Казани один заказ.
outcomes:
- группировать заказы по городу
- считать SUM и COUNT
- не путать сумму с числом строк
- выбирать группу через ORDER BY агрегата
