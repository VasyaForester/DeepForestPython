- type: code
  title: Сумма города
  difficulty: 2
  context: development
  prompt: 'Заказы: Москва 10 и 15, Казань 7, 8 и 1. Прочитайте город и выведите сумму его
    заказов.'
  starter_code: ''
  tests:
  - stdin: 'Москва

      '
    expected_stdout: '25

      '
  - stdin: 'Казань

      '
    expected_stdout: '16

      '
  hints:
  - Фильтруйте город через ?.
  - SUM складывает amount.
  - Печатайте одно число.
  solution: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table orders(city text, amount int)'')

    con.executemany(''insert into orders values (?, ?)'', [(''Москва'', 10), (''Москва'',
    15), (''Казань'', 7), (''Казань'', 8), (''Казань'', 1)])

    city = input().strip()

    row = con.execute(''select sum(amount) from orders where city = ?'', (city,)).fetchone()

    print(row[0])

    '
  explanation: Все заказы города схлопываются в одну сумму.
  id: python.sql.sql-group.t3
