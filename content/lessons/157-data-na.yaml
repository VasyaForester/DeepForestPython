id: python.data.data-na
slug: data-na
section: data
title: Пропуски
order: 12
weight: 1
prerequisites:
- python.data.data-columns
goal: Замечать пропуск и либо выбрасывать его, либо заполнять.
tags:
- пропуски
- fillna
theory:
- Пропуск в таблице — пустое значение. В pandas его часто видно как NaN. dropna выбрасывает
  строки с пропуском, fillna подставляет запасное число.
- 'В обычном Python пропуск здесь записывают как None или как пустую строку. Ноль — это измерение,
  а не пропуск: его нельзя тихо выбросить.'
- Упражнение отличает знак «-» от числа и считает по спискам, потому что pandas нет в среде
  браузера.
examples:
- title: Выбросить пропуски
  code: 'heights = [12, None, 9, None]

    clean = [height for height in heights if height is not None]

    print(len(clean))

    print(sum(clean))

    '
  explanation: Два пропуска выброшены. Остались 12 и 9, сумма 21.
- title: Заполнить нулём
  code: 'prices = ["120", "", "80"]

    filled = [int(price) if price else 0 for price in prices]

    print(sum(filled))

    '
  explanation: Пустая строка стала 0. Сумма 200.
outcomes:
- отличать пропуск от нуля
- выбрасывать пропуски перед суммой
- заполнять пропуск заданным числом
- понимать dropna и fillna
