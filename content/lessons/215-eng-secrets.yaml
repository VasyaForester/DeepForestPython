id: python.engineering.eng-secrets
slug: eng-secrets
section: engineering
title: Секреты
order: 7
weight: 1
prerequisites:
- python.engineering.eng-logs
goal: Показать в mask только последние два символа строки.
tags:
- секрет
- маска
- лог
theory:
- Секрет не коммитят и не печатают целиком в лог. В репозиторий ему не место.
- Функция mask оставляет видимыми только два последних символа, остальное закрывает звёздами.
  На вход берут строку из ввода, а не ключ реального сервиса.
- 'Если символов меньше двух, закрывать нечего: функция возвращает строку как есть. Для более
  длинной строки звёзд столько, сколько символов спрятано.'
examples:
- title: Четыре символа
  code: "def mask(secret):\n    if len(secret) < 2:\n        return secret\n    return '*'\
    \ * (len(secret) - 2) + secret[-2:]\nprint(mask('ab12'))\n"
  explanation: Спрятаны два первых символа, видны 12.
- title: Короткое слово
  code: "def mask(secret):\n    if len(secret) < 2:\n        return secret\n    return '*'\
    \ * (len(secret) - 2) + secret[-2:]\nprint(mask('xyz'))\n"
  explanation: Из трёх символов видна пара yz, первый закрыт звездой.
outcomes:
- не печатать секрет целиком
- оставлять видимыми два последних символа
- закрывать остальное звёздами
- брать строку из ввода, а не ключ сервиса
resources:
- kind: docs
  title: Errors and Exceptions
  url: https://docs.python.org/3/tutorial/errors.html
- kind: youtube
  title: CS50P — Lecture 9
  url: https://www.youtube.com/watch?v=5qz5pSO1YTQ
  author: Harvard CS50
tasks:
- type: choice
  title: Что нельзя класть в репозиторий
  difficulty: 1
  context: neutral
  prompt: Почему секрет закрывают в выводе?
  options:
  - id: a
    text: Полную строку не должно быть видно в логе и в коммите
  - id: b
    text: Звёзды ускоряют программу
  - id: c
    text: Последние два символа нужно удалить
  answer: a
  hints:
  - В репозиторий секрет не коммитят.
  - mask прячет начало, а не конец.
  - Скорость здесь ни при чём.
  solution: a
  explanation: Наружу остаются только два последних символа, чтобы строку можно было узнать,
    но не прочитать целиком.
  id: python.engineering.eng-secrets.t1
- type: predict_output
  title: Четыре знака
  difficulty: 1
  context: neutral
  prompt: Что напечатает программа?
  options:
  - id: a
    text: '**12'
  - id: b
    text: ab12
  - id: c
    text: '*12'
  answer: a
  hints:
  - Длина 4, спрятать нужно 2 символа.
  - Хвост — символы 1 и 2.
  - Звёзд две.
  solution: a
  explanation: Видна только пара последних символов.
  code: "def mask(secret):\n    if len(secret) < 2:\n        return secret\n    return '*'\
    \ * (len(secret) - 2) + secret[-2:]\nprint(mask('ab12'))\n"
  id: python.engineering.eng-secrets.t2
- type: code
  title: Маска ввода
  difficulty: 2
  context: development
  prompt: 'Прочитайте строку и напечатайте mask: видны только последние 2 символа, остальные
    звёзды. Строку короче двух символов верните как есть.'
  starter_code: ''
  tests:
  - stdin: 'ab12

      '
    expected_stdout: '**12

      '
  - stdin: 'xyz

      '
    expected_stdout: '*yz

      '
  hints:
  - Хвост берётся срезом [-2:].
  - Число звёзд — длина минус 2.
  - Печатайте результат mask.
  solution: "def mask(secret):\n    if len(secret) < 2:\n        return secret\n    return\
    \ '*' * (len(secret) - 2) + secret[-2:]\nprint(mask(input()))\n"
  explanation: Функция закрывает начало той строки, которую передали.
  id: python.engineering.eng-secrets.t3
- type: code
  title: Складской код
  difficulty: 2
  context: development
  prompt: Та же mask. Прочитайте код склада и напечатайте закрытую строку.
  starter_code: ''
  tests:
  - stdin: 'склад99

      '
    expected_stdout: '*****99

      '
  - stdin: 'ab

      '
    expected_stdout: 'ab

      '
  hints:
  - У склад99 хвост 99.
  - У строки из двух символов звёзд нет.
  - Не подставляйте свой пример вместо ввода.
  solution: "def mask(secret):\n    if len(secret) < 2:\n        return secret\n    return\
    \ '*' * (len(secret) - 2) + secret[-2:]\nprint(mask(input()))\n"
  explanation: Маска работает с любой переданной строкой, включая короткую.
  id: python.engineering.eng-secrets.t4
- type: code
  title: Две строки
  difficulty: 2
  context: development
  prompt: Прочитайте две строки и напечатайте mask для каждой на отдельной строке.
  starter_code: ''
  tests:
  - stdin: 'ab12

      xyz

      '
    expected_stdout: '**12

      *yz

      '
  - stdin: 'q

      token

      '
    expected_stdout: 'q

      ***en

      '
  hints:
  - Каждый input идёт в свой mask.
  - Одна буква остаётся как есть.
  - token прячет всё, кроме двух последних.
  solution: "def mask(secret):\n    if len(secret) < 2:\n        return secret\n    return\
    \ '*' * (len(secret) - 2) + secret[-2:]\nprint(mask(input()))\nprint(mask(input()))\n"
  explanation: Один и тот же приём применяется к каждой прочитанной строке.
  id: python.engineering.eng-secrets.t5
introduces:
- id: eng-mask
  title: Маска секрета
  summary: Показывает только два последних символа строки. Полный секрет не коммитят.
