  title: Что фильтрует WHERE
  difficulty: 1
  context: neutral
  prompt: Что делает условие в запросе SELECT name FROM trees WHERE height > 15?
  options:
  - id: a
    text: Оставляет только строки выше 15
  - id: b
    text: Сортирует все строки по имени
  - id: c
