  answer: a
  hints:
  - SELECT выбирает столбец name.
  - WHERE решает, какие строки попадут в ответ.
  - Удаление таблицы здесь не происходит.
  solution: a
  explanation: WHERE фильтрует строки до того, как их вернут.
  id: python.sql.sql-select.t1
- type: predict_output
  title: Одна сосна
  difficulty: 1
  context: neutral
  prompt: Что напечатается?
  options:
  - id: a
    text: сосна
  - id: b
    text: ель
  - id: c
    text: пусто
  answer: a
  hints:
  - 12 не больше 15.
  - 20 проходит условие.
  - fetchone берёт единственную подходящую строку.
  solution: a
  explanation: Условие height > 15 оставляет сосну.
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.execute("insert into trees values (''ель'', 12)")

    con.execute("insert into trees values (''сосна'', 20)")

    row = con.execute(''select name from trees where height > 15'').fetchone()

    print(row[0])

    '
  id: python.sql.sql-select.t2
- type: code
  title: Имена выше порога
  difficulty: 2
  context: development
  prompt: В таблице ель 12, сосна 20, берёза 30 прочитайте порог и выведите имена с высотой
    строго больше порога по алфавиту.
  starter_code: ''
  tests:
  - stdin: '15

      '
    expected_stdout: 'берёза

      сосна

      '
  - stdin: '25

      '
    expected_stdout: 'берёза

      '
  hints:
  - Создайте таблицу в памяти.
  - Подставьте порог через ?.
  - ORDER BY name фиксирует порядок.
  solution: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table\
    \ trees(name text, height int)')\ncon.executemany('insert into trees values (?, ?)', [('ель',\
    \ 12), ('сосна', 20), ('берёза', 30)])\nlimit = int(input())\nfor row in con.execute('select\
    \ name from trees where height > ? order by name', (limit,)):\n    print(row[0])\n"
  explanation: WHERE отсекает низкие деревья, ORDER BY делает вывод устойчивым.
  id: python.sql.sql-select.t3
- type: code
  title: Высота по имени
  difficulty: 2
  context: development
  prompt: В той же таблице прочитайте имя и выведите его высоту.
  starter_code: ''
  tests:
  - stdin: 'ель

      '
    expected_stdout: '12

      '
  - stdin: 'сосна

      '
    expected_stdout: '20

      '
  hints:
  - Ищите по столбцу name.
  - Знак ? заменяет склейку.
  - Печатайте число из первой колонки.
  solution: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.executemany(''insert into trees values (?, ?)'', [(''ель'', 12), (''сосна'', 20),
    (''берёза'', 30)])

    name = input().strip()

    row = con.execute(''select height from trees where name = ?'', (name,)).fetchone()

    print(row[0])

    '
  explanation: Одна строка WHERE name = ? даёт одну высоту.
  id: python.sql.sql-select.t4
- type: code
  title: Сколько выше
  difficulty: 2
  context: development
  prompt: В той же таблице прочитайте порог и выведите, сколько деревьев строго выше него.
  starter_code: ''
  tests:
  - stdin: '15

      '
    expected_stdout: '2

      '
  - stdin: '25

      '
    expected_stdout: '1

      '
  hints:
  - COUNT(*) считает оставшиеся строки.
  - Порог снова передайте через ?.
  - Печатайте одно число.
  solution: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.executemany(''insert into trees values (?, ?)'', [(''ель'', 12), (''сосна'', 20),
    (''берёза'', 30)])

    limit = int(input())

    row = con.execute(''select count(*) from trees where height > ?'', (limit,)).fetchone()

    print(row[0])

    '
  explanation: Агрегат считает строки, которые прошли WHERE.
  id: python.sql.sql-select.t5
