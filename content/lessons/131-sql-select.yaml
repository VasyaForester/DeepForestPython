id: python.sql.sql-select
slug: sql-select
section: sql
title: SELECT и WHERE
order: 1
weight: 1
prerequisites:
- python.http.http-review
goal: Выбрать строки таблицы по условию и напечатать поле.
tags:
- SELECT
- WHERE
- sqlite3
theory:
- Запрос SELECT name FROM trees WHERE height > 15 возвращает имена деревьев выше 15. SELECT
  выбирает столбцы, WHERE оставляет только подходящие строки.
- 'База живёт в памяти через sqlite3 и connect(":memory:"). Схему создают тут же: имя и высота.
  Значение подставляют знаком ?, а не склейкой строки.'
- Порядок печати задаёт ORDER BY. Без него SQLite вправе вернуть строки как удобно, и проверка
  стала бы случайной.
examples:
- title: Выше пятнадцати
  code: "import sqlite3\ncon = sqlite3.connect(':memory:')\ncon.execute('create table trees(name\
    \ text, height int)')\ncon.executemany('insert into trees values (?, ?)', [('ель', 12),\
    \ ('сосна', 20), ('берёза', 30)])\nfor row in con.execute('select name from trees where\
    \ height > 15 order by name'):\n    print(row[0])\n"
  explanation: Условие оставляет сосну и берёзу. ORDER BY name печатает берёзу раньше.
- title: Высота ели
  code: 'import sqlite3

    con = sqlite3.connect('':memory:'')

    con.execute(''create table trees(name text, height int)'')

    con.execute(''insert into trees values (?, ?)'', (''ель'', 12))

    row = con.execute(''select height from trees where name = ?'', (''ель'',)).fetchone()

    print(row[0])

    '
  explanation: WHERE name = ? находит одну строку, fetchone достаёт высоту 12.
outcomes:
- писать SELECT со столбцом и WHERE
- подставлять значение через ?
- фиксировать порядок через ORDER BY
- считать строки агрегатным COUNT
